# =========================================================================
# hvisor Github Actions CI (v9.0 - 专注 RISCV64 缓存优化版)
#
# - 核心策略: 将缓存资源集中用于优化最耗时的 riscv64 作业。
# - 缓存目标:
#   - [启用] riscv64 镜像 (~6.5GB) 被启用缓存，用于 unittest, build, systemtest。
#   - [禁用] aarch64 和 loongarch64 镜像不再使用缓存，以确保总配额充足。
# - 详细日志: 在缓存步骤中加入了明确的 ✅ HIT / ❌ MISS 日志和计时，便于调试。
# - 移除全局 env: 遵循要求，所有变量均在 step 内部定义。
# =========================================================================

name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  # =========================================================================
  # Linter 作业 (无缓存)
  # =========================================================================
  linter:
    name: linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Pull aarch64 Image (No Cache)
        run: docker pull ghcr.io/jaxtonmax/hvisor-ci-aarch64:wzm_3.0.0

      - name: Run Linter Tasks
        run: |
          CONTAINER_NAME="ci-container-linter"
          IMAGE_NAME="ghcr.io/jaxtonmax/hvisor-ci-aarch64:wzm_3.0.0"
          docker run -d --name ${CONTAINER_NAME} -v ${{ github.workspace }}:/workdir -w /workdir ${IMAGE_NAME} tail -f /dev/null
          docker exec ${CONTAINER_NAME} rustup set auto-self-update disable
          docker exec ${CONTAINER_NAME} make fmt-test

      - name: Stop Container
        if: always()
        run: docker stop "ci-container-linter" && docker rm "ci-container-linter" || true

  # =========================================================================
  # Unittest 作业
  # =========================================================================
  unittest-aarch64:
    name: unittest (aarch64 on ${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { board: ["qemu-gicv3", "qemu-gicv2"] } }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: 'recursive' }
      - name: Pull aarch64 Image (No Cache)
        run: docker pull ghcr.io/jaxtonmax/hvisor-ci-aarch64:wzm_3.0.0
      - name: Run Unit Test
        run: |
          CONTAINER_NAME="ci-container-unittest-aarch64-${{ matrix.board }}"
          IMAGE_NAME="ghcr.io/jaxtonmax/hvisor-ci-aarch64:wzm_3.0.0"
          docker run -d --name ${CONTAINER_NAME} -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=aarch64 --env BOARD=${{ matrix.board }} ${IMAGE_NAME} tail -f /dev/null
          docker exec ${CONTAINER_NAME} rustup set auto-self-update disable
          docker exec ${CONTAINER_NAME} make test
      - if: always()
        run: docker stop "ci-container-unittest-aarch64-${{ matrix.board }}" && docker rm "ci-container-unittest-aarch64-${{ matrix.board }}" || true

  unittest-riscv64:
    name: unittest (riscv64 on ${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { board: ["qemu-plic", "qemu-aia"] } }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: 'recursive' }
      - name: 1. Set up Cache Paths and Keys for RISCV64
        id: cache-setup
        run: |
          IMAGE_NAME="ghcr.io/jaxtonmax/hvisor-ci-riscv64:wzm_3.0.0"
          SANITIZED_IMAGE_NAME=$(echo ${IMAGE_NAME} | sed 's|[:/]|_-_|g')
          echo "IMAGE_TAR_PATH=image_${SANITIZED_IMAGE_NAME}.tar" >> $GITHUB_ENV
          echo "CACHE_KEY=docker-cache-${SANITIZED_IMAGE_NAME}-${{ runner.os }}" >> $GITHUB_ENV
      - name: 2. Restore RISCV64 Docker Image from Cache
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: ${{ env.IMAGE_TAR_PATH }}
          key: ${{ env.CACHE_KEY }}
      - name: 3. [CACHE HIT] Load Docker Image from file
        if: steps.cache-restore.outputs.cache-hit == 'true'
        run: |
          echo "================================================="
          echo "✅ CACHE HIT! Loading RISCV64 image from local tarball."
          echo "File: ${{ env.IMAGE_TAR_PATH }}"
          echo "================================================="
          start_time=$(date +%s)
          docker load -i ${{ env.IMAGE_TAR_PATH }}
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "Image loaded in ${duration} seconds."
      - name: 4. [CACHE MISS] Pull Image and Save to Cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          echo "================================================="
          echo "❌ CACHE MISS. Pulling full RISCV64 image from registry."
          echo "This will be slow, but will be cached for the next run."
          echo "================================================="
          start_time=$(date +%s)
          docker pull ghcr.io/jaxtonmax/hvisor-ci-riscv64:wzm_3.0.0
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "Image pulled in ${duration} seconds."
          echo "-------------------------------------------------"
          echo "Saving image to ${{ env.IMAGE_TAR_PATH }} for future cache..."
          docker save ghcr.io/jaxtonmax/hvisor-ci-riscv64:wzm_3.0.0 -o ${{ env.IMAGE_TAR_PATH }}
          echo "Image saved."
      - name: 5. Run Unit Test
        run: |
          CONTAINER_NAME="ci-container-unittest-riscv64-${{ matrix.board }}"
          IMAGE_NAME="ghcr.io/jaxtonmax/hvisor-ci-riscv64:wzm_3.0.0"
          docker run -d --name ${CONTAINER_NAME} -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=riscv64 --env BOARD=${{ matrix.board }} ${IMAGE_NAME} tail -f /dev/null
          docker exec ${CONTAINER_NAME} rustup set auto-self-update disable
          docker exec ${CONTAINER_NAME} make test
      - if: always()
        name: 6. Stop and Remove Container
        run: docker stop "ci-container-unittest-riscv64-${{ matrix.board }}" && docker rm "ci-container-unittest-riscv64-${{ matrix.board }}" || true

  # =========================================================================
  # Build 作业
  # =========================================================================
  build-aarch64:
    name: build (aarch64 on ${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { board: ["qemu-gicv3", "qemu-gicv2", "zcu102", "imx8mp", "rk3568", "rk3588", "ok6254-c"] } }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: 'recursive' }
      - name: Pull aarch64 Image (No Cache)
        run: docker pull ghcr.io/jaxtonmax/hvisor-ci-aarch64:wzm_3.0.0
      - name: Run Build
        run: |
          CONTAINER_NAME="ci-container-build-aarch64-${{ matrix.board }}"
          IMAGE_NAME="ghcr.io/jaxtonmax/hvisor-ci-aarch64:wzm_3.0.0"
          docker run -d --name ${CONTAINER_NAME} -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=aarch64 --env BOARD=${{ matrix.board }} ${IMAGE_NAME} tail -f /dev/null
          docker exec ${CONTAINER_NAME} rustup set auto-self-update disable
          docker exec ${CONTAINER_NAME} make
      - if: always()
        run: docker stop "ci-container-build-aarch64-${{ matrix.board }}" && docker rm "ci-container-build-aarch64-${{ matrix.board }}" || true

  build-riscv64:
    name: build (riscv64 on ${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { board: ["qemu-aia", "qemu-plic"] } }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: 'recursive' }
      - name: 1. Set up Cache Paths and Keys for RISCV64
        id: cache-setup
        run: |
          IMAGE_NAME="ghcr.io/jaxtonmax/hvisor-ci-riscv64:wzm_3.0.0"
          SANITIZED_IMAGE_NAME=$(echo ${IMAGE_NAME} | sed 's|[:/]|_-_|g')
          echo "IMAGE_TAR_PATH=image_${SANITIZED_IMAGE_NAME}.tar" >> $GITHUB_ENV
          echo "CACHE_KEY=docker-cache-${SANITIZED_IMAGE_NAME}-${{ runner.os }}" >> $GITHUB_ENV
      - name: 2. Restore RISCV64 Docker Image from Cache
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: ${{ env.IMAGE_TAR_PATH }}
          key: ${{ env.CACHE_KEY }}
      - name: 3. [CACHE HIT] Load Docker Image from file
        if: steps.cache-restore.outputs.cache-hit == 'true'
        run: |
          echo "================================================="
          echo "✅ CACHE HIT! Loading RISCV64 image from local tarball."
          echo "================================================="
          docker load -i ${{ env.IMAGE_TAR_PATH }}
      - name: 4. [CACHE MISS] Pull Image and Save to Cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          echo "================================================="
          echo "❌ CACHE MISS. Pulling full RISCV64 image from registry."
          echo "================================================="
          docker pull ghcr.io/jaxtonmax/hvisor-ci-riscv64:wzm_3.0.0
          docker save ghcr.io/jaxtonmax/hvisor-ci-riscv64:wzm_3.0.0 -o ${{ env.IMAGE_TAR_PATH }}
      - name: 5. Run Build
        run: |
          CONTAINER_NAME="ci-container-build-riscv64-${{ matrix.board }}"
          IMAGE_NAME="ghcr.io/jaxtonmax/hvisor-ci-riscv64:wzm_3.0.0"
          docker run -d --name ${CONTAINER_NAME} -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=riscv64 --env BOARD=${{ matrix.board }} ${IMAGE_NAME} tail -f /dev/null
          docker exec ${CONTAINER_NAME} rustup set auto-self-update disable
          docker exec ${CONTAINER_NAME} make
      - if: always()
        name: 6. Stop and Remove Container
        run: docker stop "ci-container-build-riscv64-${{ matrix.board }}" && docker rm "ci-container-build-riscv64-${{ matrix.board }}" || true

  build-loongarch64:
    name: build (loongarch64 on ls3a5000)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: 'recursive' }
      - name: Pull LoongArch Image (No Cache)
        run: docker pull ghcr.io/jaxtonmax/hvisor-ci-loongarch64:wzm_3.0.0
      - name: Run Build
        run: |
          CONTAINER_NAME="ci-container-build-loongarch64"
          IMAGE_NAME="ghcr.io/jaxtonmax/hvisor-ci-loongarch64:wzm_3.0.0"
          docker run -d --name ${CONTAINER_NAME} -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=loongarch64 --env BOARD=ls3a5000 ${IMAGE_NAME} tail -f /dev/null
          docker exec ${CONTAINER_NAME} rustup set auto-self-update disable
          docker exec ${CONTAINER_NAME} make
      - if: always()
        run: docker stop "ci-container-build-loongarch64" && docker rm "ci-container-build-loongarch64" || true

  # =========================================================================
  # Systemtest 作业
  # =========================================================================
  systemtest-aarch64:
    name: systemtest (aarch64 on qemu-gicv3)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: 'recursive' }
      - name: Pull aarch64 Image (No Cache)
        run: docker pull ghcr.io/jaxtonmax/hvisor-ci-aarch64:wzm_3.0.0
      - name: Run System Test
        run: |
          CONTAINER_NAME="ci-container-systemtest-aarch64"
          IMAGE_NAME="ghcr.io/jaxtonmax/hvisor-ci-aarch64:wzm_3.0.0"
          docker run -d --name ${CONTAINER_NAME} --cap-add=SYS_ADMIN --privileged -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=aarch64 --env BOARD=qemu-gicv3 ${IMAGE_NAME} tail -f /dev/null
          docker exec ${CONTAINER_NAME} rustup set auto-self-update disable
          docker exec ${CONTAINER_NAME} make stest
      - if: always()
        run: docker stop "ci-container-systemtest-aarch64" && docker rm "ci-container-systemtest-aarch64" || true

  systemtest-riscv64:
    name: systemtest (riscv64 on qemu-plic)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: 'recursive' }
      - name: 1. Set up Cache Paths and Keys for RISCV64
        id: cache-setup
        run: |
          IMAGE_NAME="ghcr.io/jaxtonmax/hvisor-ci-riscv64:wzm_3.0.0"
          SANITIZED_IMAGE_NAME=$(echo ${IMAGE_NAME} | sed 's|[:/]|_-_|g')
          echo "IMAGE_TAR_PATH=image_${SANITIZED_IMAGE_NAME}.tar" >> $GITHUB_ENV
          echo "CACHE_KEY=docker-cache-${SANITIZED_IMAGE_NAME}-${{ runner.os }}" >> $GITHUB_ENV
      - name: 2. Restore RISCV64 Docker Image from Cache
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: ${{ env.IMAGE_TAR_PATH }}
          key: ${{ env.CACHE_KEY }}
      - name: 3. [CACHE HIT] Load Docker Image from file
        if: steps.cache-restore.outputs.cache-hit == 'true'
        run: |
          echo "================================================="
          echo "✅ CACHE HIT! Loading RISCV64 image from local tarball."
          echo "================================================="
          docker load -i ${{ env.IMAGE_TAR_PATH }}
      - name: 4. [CACHE MISS] Pull Image and Save to Cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          echo "================================================="
          echo "❌ CACHE MISS. Pulling full RISCV64 image from registry."
          echo "================================================="
          docker pull ghcr.io/jaxtonmax/hvisor-ci-riscv64:wzm_3.0.0
          docker save ghcr.io/jaxtonmax/hvisor-ci-riscv64:wzm_3.0.0 -o ${{ env.IMAGE_TAR_PATH }}
      - name: 5. Run System Test
        run: |
          CONTAINER_NAME="ci-container-systemtest-riscv64"
          IMAGE_NAME="ghcr.io/jaxtonmax/hvisor-ci-riscv64:wzm_3.0.0"
          docker run -d --name ${CONTAINER_NAME} --cap-add=SYS_ADMIN --privileged -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=riscv64 --env BOARD=qemu-plic ${IMAGE_NAME} tail -f /dev/null
          docker exec ${CONTAINER_NAME} rustup set auto-self-update disable
          docker exec ${CONTAINER_NAME} make stest
      - if: always()
        name: 6. Stop and Remove Container
        run: docker stop "ci-container-systemtest-riscv64" && docker rm "ci-container-systemtest-riscv64" || true

  # =========================================================================
  # License-checker 作业 (保持不变) 2
  # =========================================================================
  license-checker:
    name: license-checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: License Check
        run: |
          set -x
          ./tools/license_checker.sh