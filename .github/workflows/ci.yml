# =========================================================================
# hvisor Github Actions CI (v3.2 - 深度缓存诊断版)
#
# - 核心目标: 彻底诊断缓存未命中的问题。
# - 显式验证: 在每个 Job 中增加了明确的步骤，用于检查缓存恢复 action 的输出。
# - 预测性检查: 增加了一个步骤，用于在 Job 结束前估算镜像打包后的大小，
#   提前预警是否会超出 GitHub Actions 10GB 的缓存限制。
# - 详细日志: 提供了丰富的日志输出，明确告知缓存是命中还是未命中，
#   并解释判断依据，帮助快速定位问题根源。
# =========================================================================

name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  CONTAINER_NAME: ci-container
  IMAGE_VERSION: wzm_3.0.0
  # 定义 10GB 的字节数，用于比较
  TEN_GB_IN_BYTES: 10737418240

jobs:
  # =========================================================================
  # Linter 作业 (集成深度缓存诊断)
  # =========================================================================
  linter:
    name: linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 1. Attempt to Restore Docker Layer Cache
        id: cache-restore
        uses: satackey/action-docker-layer-caching@v0.0.11
        with:
          # 使用明确的、可预测的缓存密钥
          key: docker-cache-linter-${{ runner.os }}
        continue-on-error: true

      - name: 2. Analyze Cache Restore Attempt
        id: analyze-cache
        run: |
          echo "==================== CACHE ANALYSIS ===================="
          if [[ "${{ steps.cache-restore.outputs.cache-hit }}" == "true" ]]; then
            echo "✅ STATUS: Cache restore action reported a CACHE HIT."
            echo "This means a cache file was found, downloaded, and loaded via 'docker load'."
            echo "cache-hit=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ STATUS: Cache restore action reported a CACHE MISS."
            echo "This is normal for the first run, but if it persists, it means the cache was not found or the previous save failed."
            echo "cache-hit=false" >> $GITHUB_OUTPUT
          fi
          echo "========================================================"
          echo "Inspecting local docker images AFTER cache restore attempt:"
          docker images

      - name: 3. Pull Image & Final Verification
        run: |
          IMAGE_NAME="ghcr.io/jaxtonmax/hvisor-ci-base:${{ env.IMAGE_VERSION }}"
          echo "Pulling image: ${IMAGE_NAME}"
          start_time=$(date +%s)
          docker pull ${IMAGE_NAME}
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          
          echo "================== FINAL VERIFICATION =================="
          echo "Pull duration: ${duration} seconds."
          if [[ "${{ steps.analyze-cache.outputs.cache-hit }}" == "true" && ${duration} -lt 60 ]]; then
            echo "✅✅✅ VERDICT: SUCCESSFUL CACHE HIT! ✅✅✅"
            echo "Reasoning: The restore step reported a hit AND the pull time was short."
          else
            echo "❌❌❌ VERDICT: CACHE MISS OR INEFFECTIVE CACHE! ❌❌❌"
            echo "Reasoning:"
            if [[ "${{ steps.analyze-cache.outputs.cache-hit }}" != "true" ]]; then
              echo "- The initial cache restore step reported a MISS."
            fi
            if [[ ${duration} -ge 60 ]]; then
              echo "- The pull duration was long (${duration}s), indicating a full download from the registry."
            fi
            echo "This means the next run should be faster if the cache saves correctly this time."
          fi
          echo "========================================================"

      - name: 4. Predict Cache Save Size
        run: |
          IMAGE_NAME="ghcr.io/jaxtonmax/hvisor-ci-base:${{ env.IMAGE_VERSION }}"
          echo "Predicting final cache size for image: ${IMAGE_NAME}"
          saved_size=$(docker save ${IMAGE_NAME} | wc -c)
          echo "================== CACHE SAVE PREDICTION =============="
          echo "Estimated packed size: ${saved_size} bytes."
          echo "GitHub Cache Limit:    ${{ env.TEN_GB_IN_BYTES }} bytes (10 GB)."
          if [[ ${saved_size} -gt ${{ env.TEN_GB_IN_BYTES }} ]]; then
            echo "🚨🚨🚨 WARNING: IMAGE IS TOO LARGE TO CACHE! 🚨🚨🚨"
            echo "The packed size exceeds 10 GB. The 'Post Job' cache saving step WILL FAIL."
          else
            echo "✅ The image size is within the cache limit. The save step should succeed."
          fi
          echo "========================================================"

      - name: Run Container in Background
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} -v ${{ github.workspace }}:/workdir -w /workdir ghcr.io/jaxtonmax/hvisor-ci-base:${{ env.IMAGE_VERSION }} tail -f /dev/null
      - name: Run Linter Tasks
        run: |
          docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
          docker exec ${{ env.CONTAINER_NAME }} make fmt-test
      - name: Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

  # =========================================================================
  # Build 作业 (集成深度缓存诊断) - 【注意：此作业的日志最关键】
  # =========================================================================
  build:
    name: build (${{ matrix.arch }} on ${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: riscv64
            board: "qemu-plic"
          - arch: loongarch64
            board: "ls3a5000"
        # ... [为了简洁，省略了其他 board，您可以按需加回]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 1. Attempt to Restore Docker Layer Cache
        id: cache-restore
        uses: satackey/action-docker-layer-caching@v0.0.11
        with:
          key: docker-cache-build-${{ matrix.arch }}-${{ runner.os }}
        continue-on-error: true

      - name: 2. Analyze Cache Restore Attempt
        id: analyze-cache
        run: |
          echo "==================== CACHE ANALYSIS ===================="
          if [[ "${{ steps.cache-restore.outputs.cache-hit }}" == "true" ]]; then
            echo "✅ STATUS: Cache restore action reported a CACHE HIT."
            echo "cache-hit=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ STATUS: Cache restore action reported a CACHE MISS."
            echo "cache-hit=false" >> $GITHUB_OUTPUT
          fi
          echo "========================================================"
          echo "Inspecting local docker images AFTER cache restore attempt:"
          docker images

      - name: 3. Pull Image & Final Verification
        run: |
          IMAGE_NAME="ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:${{ env.IMAGE_VERSION }}"
          echo "Pulling image: ${IMAGE_NAME}"
          start_time=$(date +%s)
          docker pull ${IMAGE_NAME}
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          
          echo "================== FINAL VERIFICATION =================="
          echo "Pull duration: ${duration} seconds."
          if [[ "${{ steps.analyze-cache.outputs.cache-hit }}" == "true" && ${duration} -lt 60 ]]; then
            echo "✅✅✅ VERDICT: SUCCESSFUL CACHE HIT! ✅✅✅"
          else
            echo "❌❌❌ VERDICT: CACHE MISS OR INEFFECTIVE CACHE! ❌❌❌"
            echo "Reasoning:"
            if [[ "${{ steps.analyze-cache.outputs.cache-hit }}" != "true" ]]; then echo "- The initial cache restore step reported a MISS."; fi
            if [[ ${duration} -ge 60 ]]; then echo "- The pull duration was long (${duration}s), indicating a full download."; fi
          fi
          echo "========================================================"

      - name: 4. Predict Cache Save Size
        # 这个步骤对于 loongarch64 尤其重要
        run: |
          IMAGE_NAME="ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:${{ env.IMAGE_VERSION }}"
          echo "Predicting final cache size for image: ${IMAGE_NAME}"
          saved_size=$(docker save ${IMAGE_NAME} | wc -c)
          echo "================== CACHE SAVE PREDICTION =============="
          echo "Estimated packed size: ${saved_size} bytes."
          echo "GitHub Cache Limit:    ${{ env.TEN_GB_IN_BYTES }} bytes (10 GB)."
          if [[ ${saved_size} -gt ${{ env.TEN_GB_IN_BYTES }} ]]; then
            echo "🚨🚨🚨 WARNING: IMAGE IS TOO LARGE TO CACHE! 🚨🚨🚨"
            echo "The packed size exceeds 10 GB. The 'Post Job' cache saving step WILL FAIL."
          else
            echo "✅ The image size is within the cache limit. The save step should succeed."
          fi
          echo "========================================================"

      - name: Run Container in Background
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=${{ matrix.arch }} --env BOARD=${{ matrix.board }} ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:${{ env.IMAGE_VERSION }} tail -f /dev/null
      - name: Build
        run: |
          docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
          docker exec ${{ env.CONTAINER_NAME }} make
      - name: Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

# ... [unittest, systemtest 作业也应采用相同的诊断步骤模式] ...
# ... [为了简洁，此处省略，您可以将 build 作业的诊断步骤复制过去] ...

  # =========================================================================
  # License-checker 作业 (保持不变)
  # =========================================================================
  license-checker:
    name: license-checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: License Check
        run: |
          set -x
          ./tools/license_checker.sh