# hvisor Github Actions CI
# 最终修正版：通过在 steps 中手动控制 Docker 生命周期来确保缓存生效。

name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  CI_IMAGE: ghcr.io/jaxtonmax/hvisor-ci:wzm_1.0.2
  # 为后台运行的容器指定一个固定的名字
  CONTAINER_NAME: ci-container

jobs:
  # =========================================================================
  # 放弃 container: 指令，在每个作业中手动管理 Docker
  # =========================================================================
  linter:
    name: linter
    runs-on: ubuntu-latest
    steps:
      # 1. 恢复缓存（这是第一步，至关重要）
      - name: Restore Docker Layer Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      # 2. 拉取镜像（现在它会利用上面的缓存）
      - name: Pull CI Image
        run: docker pull ${{ env.CI_IMAGE }}

      # 3. 检出代码到主机
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 4. 在后台启动容器，并挂载代码目录
      - name: Run Container in Background
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} \
            -v ${{ github.workspace }}:/workdir \
            -w /workdir \
            --env RUSTUP_DIST_SERVER="https://static.rust-lang.org" \
            --env RUSTUP_UPDATE_ROOT="https://static.rust-lang.org/rustup" \
            ${{ env.CI_IMAGE }} \
            tail -f /dev/null # 保持容器持续运行

      # 5. 在运行的容器内执行所有命令
      - name: Disable rustup auto update
        run: docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
      - name: Format Check
        run: docker exec ${{ env.CONTAINER_NAME }} make fmt-test

      # 6. 作业结束时，清理容器
      - name: Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

  # ... 对所有其他作业应用相同的模式 ...

  unittest:
    name: unittest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: aarch64
            board: "qemu-gicv2"
          - arch: riscv64
            board: "qemu-plic"
          - arch: riscv64
            board: "qemu-aia"
    steps:
      - name: Restore Docker Layer Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true
      - name: Pull CI Image
        run: docker pull ${{ env.CI_IMAGE }}
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Run Container in Background
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} \
            -v ${{ github.workspace }}:/workdir \
            -w /workdir \
            --env ARCH=${{ matrix.arch }} \
            --env BOARD=${{ matrix.board }} \
            --env RUSTUP_DIST_SERVER="https://static.rust-lang.org" \
            --env RUSTUP_UPDATE_ROOT="https://static.rust-lang.org/rustup" \
            ${{ env.CI_IMAGE }} \
            tail -f /dev/null
      - name: Disable rustup auto update
        run: docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
      - name: Unit Test
        run: docker exec ${{ env.CONTAINER_NAME }} make test
      - name: Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

  build:
    name: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          # ... etc, all your other matrix entries
          - arch: riscv64
            board: "qemu-plic"
          - arch: loongarch64
            board: "ls3a5000"
    steps:
      - name: Restore Docker Layer Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true
      - name: Pull CI Image
        run: docker pull ${{ env.CI_IMAGE }}
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Run Container in Background
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} \
            -v ${{ github.workspace }}:/workdir \
            -w /workdir \
            --env ARCH=${{ matrix.arch }} \
            --env BOARD=${{ matrix.board }} \
            --env RUSTUP_DIST_SERVER="https://static.rust-lang.org" \
            --env RUSTUP_UPDATE_ROOT="https://static.rust-lang.org/rustup" \
            ${{ env.CI_IMAGE }} \
            tail -f /dev/null
      - name: Disable rustup auto update
        run: docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
      - name: Build
        run: docker exec ${{ env.CONTAINER_NAME }} make
      - name: Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

  systemtest:
    name: systemtest
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: riscv64
            board: "qemu-plic"
    steps:
      - name: Restore Docker Layer Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true
      - name: Pull CI Image
        run: docker pull ${{ env.CI_IMAGE }}
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Run Container in Background
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} \
            --cap-add=SYS_ADMIN --privileged \
            -v ${{ github.workspace }}:/workdir \
            -w /workdir \
            --env ARCH=${{ matrix.arch }} \
            --env BOARD=${{ matrix.board }} \
            --env RUSTUP_DIST_SERVER="https://static.rust-lang.org" \
            --env RUSTUP_UPDATE_ROOT="https://static.rust-lang.org/rustup" \
            ${{ env.CI_IMAGE }} \
            tail -f /dev/null
      - name: Disable rustup auto update
        run: docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
      - name: Run System Test
        run: docker exec ${{ env.CONTAINER_NAME }} make stest
      - name: Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

  license-checker:
    name: license-checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: License Check
        run: |
          set -x
          ./tools/license_checker.sh