# hvisor Github Actions CI (最终容器化优化版)
#
# 这个工作流利用预先构建的 Docker 镜像来提供一个快速、可靠且一致的测试环境。
# 它通过 Docker 层缓存机制，显著减少了后续运行的启动时间。

name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  # 统一管理镜像名称和版本，方便未来升级
  CI_IMAGE_PREFIX: ghcr.io/jaxtonmax/hvisor-ci
  IMAGE_VERSION: 1.1.2
  # 为所有 job 中的容器使用一个统一的名称
  CONTAINER_NAME: ci-container

jobs:
  linter:
    name: linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Docker Layer Cache
        # 关键步骤：尝试从缓存中恢复 Docker 镜像层
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true # 如果缓存未命中或失败，也继续执行

      - name: Pull CI Image
        # 拉取 aarch64 镜像作为通用的 linter 环境
        run: docker pull ${{ env.CI_IMAGE_PREFIX }}:aarch64_${{ env.IMAGE_VERSION }}

      - name: Run Container in Background
        # 启动一个后台容器，并将代码目录挂载进去
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} \
            -v ${{ github.workspace }}:/workdir \
            -w /workdir \
            ${{ env.CI_IMAGE_PREFIX }}:aarch64_${{ env.IMAGE_VERSION }} \
            tail -f /dev/null # 使用一个长命令保持容器运行

      - name: Format Check
        # 在正在运行的容器内执行命令
        run: docker exec ${{ env.CONTAINER_NAME }} make fmt-test

      - name: Stop Container
        # 无论成功与否，总是在 job 结束时清理容器
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

  unittest:
    name: unittest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 矩阵现在只关心架构，因为所有依赖都在镜像里了
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: aarch64
            board: "qemu-gicv2"
          - arch: riscv64
            board: "qemu-plic"
          - arch: riscv64
            board: "qemu-aia"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Docker Layer Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Pull CI Image
        # 根据矩阵中的架构，动态拉取对应的镜像
        # 由于缓存，这里通常只会下载缺失的顶层
        run: docker pull ${{ env.CI_IMAGE_PREFIX }}:${{ matrix.arch }}_${{ env.IMAGE_VERSION }}

      - name: Run Container in Background
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} \
            -v ${{ github.workspace }}:/workdir \
            -w /workdir \
            --env ARCH=${{ matrix.arch }} \
            --env BOARD=${{ matrix.board }} \
            ${{ env.CI_IMAGE_PREFIX }}:${{ matrix.arch }}_${{ env.IMAGE_VERSION }} \
            tail -f /dev/null

      - name: Unit Test
        run: docker exec ${{ env.CONTAINER_NAME }} make test

      - name: Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

  build:
    name: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: aarch64
            board: "zcu102"
          - arch: aarch64
            board: "rk3588"
          - arch: riscv64
            board: "qemu-plic"
          - arch: loongarch64
            board: "ls3a5000"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Docker Layer Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Pull CI Image
        run: docker pull ${{ env.CI_IMAGE_PREFIX }}:${{ matrix.arch }}_${{ env.IMAGE_VERSION }}

      - name: Run Container in Background
        # 这一步保持上次的修改，因为它正确地为 cargo 设置了链接器名称
        run: |
          LINKER_ENV=""
          if [ "${{ matrix.arch }}" == "loongarch64" ]; then
            LINKER_ENV="--env CARGO_TARGET_LOONGARCH64_UNKNOWN_NONE_LINKER=loongarch64-clfs-linux-gnu-gcc"
          fi
          
          docker run -d --name ${{ env.CONTAINER_NAME }} \
            -v ${{ github.workspace }}:/workdir \
            -w /workdir \
            --env ARCH=${{ matrix.arch }} \
            --env BOARD=${{ matrix.board }} \
            ${LINKER_ENV} \
            ${{ env.CI_IMAGE_PREFIX }}:${{ matrix.arch }}_${{ env.IMAGE_VERSION }} \
            tail -f /dev/null

      - name: Build
        # 最终解决方案：在执行 make 命令时，为 loongarch64 显式地预置 PATH
        run: |
          if [ "${{ matrix.arch }}" == "loongarch64" ]; then
            # 对于 loongarch64，我们构造一个特殊的命令，它首先设置 PATH，然后执行 make
            # 注意：\$PATH 中的反斜杠是必须的，以确保 $PATH 是在容器内被解析，而不是在 CI runner 的 shell 中
            docker exec ${{ env.CONTAINER_NAME }} \
              sh -c "PATH=/opt/toolchain/cross-tools/bin:\$PATH make MODE=release"
          else
            # 对于其他架构，使用之前的简单命令
            docker exec ${{ env.CONTAINER_NAME }} make MODE=release
          fi

      - name: Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

  systemtest:
    name: systemtest
    runs-on: ubuntu-latest # ubuntu-22.04 也可以，但 latest 通常就足够了
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: riscv64
            board: "qemu-plic"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Docker Layer Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Pull CI Image
        run: docker pull ${{ env.CI_IMAGE_PREFIX }}:${{ matrix.arch }}_${{ env.IMAGE_VERSION }}

      - name: Run Container in Background
        # 对于需要特殊权限的系统测试，可以添加 --privileged 标志
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} --privileged \
            -v ${{ github.workspace }}:/workdir \
            -w /workdir \
            --env ARCH=${{ matrix.arch }} \
            --env BOARD=${{ matrix.board }} \
            ${{ env.CI_IMAGE_PREFIX }}:${{ matrix.arch }}_${{ env.IMAGE_VERSION }} \
            tail -f /dev/null

      - name: Run System Test
        run: docker exec ${{ env.CONTAINER_NAME }} make stest

      - name: Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

  license-checker:
    # 这个 job 很简单，不需要复杂的 Docker 环境，保持原样以实现快速执行
    name: license-checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: License Check
        run: |
          set -x  
          ./tools/license_checker.sh