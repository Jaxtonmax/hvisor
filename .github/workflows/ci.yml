# hvisor Github Actions CI
# 最终优化版：拆分镜像 + 缓存编译产物

name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  # 镜像前缀，标签将从 matrix 中动态获取
  CI_IMAGE_PREFIX: ghcr.io/jaxtonmax/hvisor-ci
  # 为后台运行的容器指定一个固定的名字
  CONTAINER_NAME: ci-container

jobs:
  linter:
    name: linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 新增: 缓存 Cargo 目录以加速格式化检查 (如果它需要编译的话)
      - name: Cache Cargo directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # linter 使用 aarch64 镜像和缓存
          key: ${{ runner.os }}-aarch64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-aarch64-cargo-

      - name: Restore Docker Layer Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Pull CI Image
        # linter 作业我们默认使用 aarch64 的镜像，因为它通常最通用
        run: docker pull ${{ env.CI_IMAGE_PREFIX }}:aarch64_1.1.1

      - name: Run Container in Background
        run: |
          # 确保主机上的目录存在，以便 Docker 挂载
          mkdir -p ~/.cargo/bin ${{ github.workspace }}/target
          docker run -d --name ${{ env.CONTAINER_NAME }} \
            -v ${{ github.workspace }}:/workdir \
            -v ~/.cargo/bin:/root/.cargo/bin \
            -v ~/.cargo/registry:/root/.cargo/registry \
            -v ~/.cargo/git:/root/.cargo/git \
            -v ${{ github.workspace }}/target:/workdir/target \
            -w /workdir \
            --env CARGO_HOME=/root/.cargo \
            --env RUSTUP_DIST_SERVER="https://static.rust-lang.org" \
            --env RUSTUP_UPDATE_ROOT="https://static.rust-lang.org/rustup" \
            ${{ env.CI_IMAGE_PREFIX }}:aarch64_1.1.1 \
            tail -f /dev/null

      - name: Disable rustup auto update
        run: docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
      - name: Format Check
        run: docker exec ${{ env.CONTAINER_NAME }} make fmt-test

      - name: Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

  unittest:
    name: unittest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
            image_tag: "aarch64_1.1.1"
          - arch: aarch64
            board: "qemu-gicv2"
            image_tag: "aarch64_1.1.1"
          - arch: riscv64
            board: "qemu-plic"
            image_tag: "riscv64_1.1.1"
          - arch: riscv64
            board: "qemu-aia"
            image_tag: "riscv64_1.1.1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 新增: 根据架构缓存 Cargo 目录
      - name: Cache Cargo directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Restore Docker Layer Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Pull CI Image
        run: docker pull ${{ env.CI_IMAGE_PREFIX }}:${{ matrix.image_tag }}

      - name: Run Container in Background
        run: |
          mkdir -p ~/.cargo/bin ${{ github.workspace }}/target
          docker run -d --name ${{ env.CONTAINER_NAME }} \
            -v ${{ github.workspace }}:/workdir \
            -v ~/.cargo/bin:/root/.cargo/bin \
            -v ~/.cargo/registry:/root/.cargo/registry \
            -v ~/.cargo/git:/root/.cargo/git \
            -v ${{ github.workspace }}/target:/workdir/target \
            -w /workdir \
            --env ARCH=${{ matrix.arch }} \
            --env BOARD=${{ matrix.board }} \
            --env CARGO_HOME=/root/.cargo \
            --env RUSTUP_DIST_SERVER="https://static.rust-lang.org" \
            --env RUSTUP_UPDATE_ROOT="https://static.rust-lang.org/rustup" \
            ${{ env.CI_IMAGE_PREFIX }}:${{ matrix.image_tag }} \
            tail -f /dev/null

      - name: Disable rustup auto update
        run: docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
      - name: Unit Test
        run: docker exec ${{ env.CONTAINER_NAME }} make test

      - name: Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

  build:
    name: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
            image_tag: "aarch64_1.1.1"
          - arch: riscv64
            board: "qemu-plic"
            image_tag: "riscv64_1.1.1"
          - arch: loongarch64
            board: "ls3a5000"
            image_tag: "loongarch64_1.1.1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Cargo directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-
            
      - name: Restore Docker Layer Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Pull CI Image
        run: docker pull ${{ env.CI_IMAGE_PREFIX }}:${{ matrix.image_tag }}

      - name: Run Container in Background
        run: |
          mkdir -p ~/.cargo/bin ${{ github.workspace }}/target
          docker run -d --name ${{ env.CONTAINER_NAME }} \
            -v ${{ github.workspace }}:/workdir \
            -v ~/.cargo/bin:/root/.cargo/bin \
            -v ~/.cargo/registry:/root/.cargo/registry \
            -v ~/.cargo/git:/root/.cargo/git \
            -v ${{ github.workspace }}/target:/workdir/target \
            -w /workdir \
            --env ARCH=${{ matrix.arch }} \
            --env BOARD=${{ matrix.board }} \
            --env CARGO_HOME=/root/.cargo \
            --env RUSTUP_DIST_SERVER="https://static.rust-lang.org" \
            --env RUSTUP_UPDATE_ROOT="https://static.rust-lang.org/rustup" \
            ${{ env.CI_IMAGE_PREFIX }}:${{ matrix.image_tag }} \
            tail -f /dev/null

      - name: Disable rustup auto update
        run: docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
      - name: Build
        run: docker exec ${{ env.CONTAINER_NAME }} make

      - name: Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

  systemtest:
    name: systemtest
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
            image_tag: "aarch64_1.1.1"
          - arch: riscv64
            board: "qemu-plic"
            image_tag: "riscv64_1.1.1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Cargo directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Restore Docker Layer Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Pull CI Image
        run: docker pull ${{ env.CI_IMAGE_PREFIX }}:${{ matrix.image_tag }}

      - name: Run Container in Background
        run: |
          mkdir -p ~/.cargo/bin ${{ github.workspace }}/target
          docker run -d --name ${{ env.CONTAINER_NAME }} \
            --cap-add=SYS_ADMIN --privileged \
            -v ${{ github.workspace }}:/workdir \
            -v ~/.cargo/bin:/root/.cargo/bin \
            -v ~/.cargo/registry:/root/.cargo/registry \
            -v ~/.cargo/git:/root/.cargo/git \
            -v ${{ github.workspace }}/target:/workdir/target \
            -w /workdir \
            --env ARCH=${{ matrix.arch }} \
            --env BOARD=${{ matrix.board }} \
            --env CARGO_HOME=/root/.cargo \
            --env RUSTUP_DIST_SERVER="https://static.rust-lang.org" \
            --env RUSTUP_UPDATE_ROOT="https://static.rust-lang.org/rustup" \
            ${{ env.CI_IMAGE_PREFIX }}:${{ matrix.image_tag }} \
            tail -f /dev/null

      - name: Disable rustup auto update
        run: docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
      - name: Run System Test
        run: docker exec ${{ env.CONTAINER_NAME }} make stest

      - name: Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

  license-checker:
    name: license-checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: License Check
        run: |
          set -x
          ./tools/license_checker.sh