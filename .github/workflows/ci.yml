# hvisor Github Actions CI
# 最终版本：基于 Ubuntu 22.04 的新镜像，并移除了不兼容的缓存机制

name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  # =========================================================================
  # Linter 作业：使用新的 base 镜像
  # =========================================================================
  linter:
    name: linter
    runs-on: ubuntu-latest
    container: ghcr.io/jaxtonmax/hvisor-ci-base:wzm_3.0.0
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Format Check
        run: make fmt-test

  # =========================================================================
  # Unittest 作业：使用新的架构镜像
  # =========================================================================
  unittest:
    name: unittest (${{ matrix.arch }} on ${{ matrix.board }})
    runs-on: ubuntu-latest
    container: ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:wzm_3.0.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: aarch64
            board: "qemu-gicv2"
          - arch: riscv64
            board: "qemu-plic"
          - arch: riscv64
            board: "qemu-aia"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Set up environment variables
        run: |
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "BOARD=${{ matrix.board }}" >> $GITHUB_ENV
      - name: Unit Test
        run: make test

  # =========================================================================
  # Build 作业：使用新的架构镜像
  # =========================================================================
  build:
    name: build (${{ matrix.arch }} on ${{ matrix.board }})
    runs-on: ubuntu-latest
    container: ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:wzm_3.0.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: aarch64
            board: "qemu-gicv2"
          - arch: aarch64
            board: "zcu102"
          - arch: aarch64
            board: "imx8mp"
          - arch: aarch64
            board: "rk3568"
          - arch: aarch64
            board: "rk3588"
          - arch: aarch64
            board: "ok6254-c"
          - arch: riscv64
            board: "qemu-aia"
          - arch: riscv64
            board: "qemu-plic"
          - arch: loongarch64
            board: "ls3a5000"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Set up environment variables
        run: |
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "BOARD=${{ matrix.board }}" >> $GITHUB_ENV
      - name: Build
        run: make

  # =========================================================================
  # Systemtest 作业：使用新的架构镜像
  # =========================================================================
  systemtest:
    name: systemtest (${{ matrix.arch }} on ${{ matrix.board }})
    runs-on: ubuntu-22.04
    container: 
      image: ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:wzm_3.0.0
      options: --cap-add=SYS_ADMIN --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: riscv64
            board: "qemu-plic"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Set up environment variables
        run: |
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "BOARD=${{ matrix.board }}" >> $GITHUB_ENV
      - name: Run System Test
        run: make stest

  # =========================================================================
  # License-checker 作业：无需容器，保持不变
  # =========================================================================
  license-checker:
    name: license-checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: License Check
        run: |
          set -x
          ./tools/license_checker.sh