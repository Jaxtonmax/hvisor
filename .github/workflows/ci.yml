name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  # Linter 作业
  linter:
    name: linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: 'recursive' }
      - name: Pull Image
        run: docker pull ghcr.io/jaxtonmax/hvisor-ci-base:wzm_3.0.0
      - name: Run Linter Tasks
        run: |
          CONTAINER_NAME="ci-linter"
          docker run -d --name ${CONTAINER_NAME} -v ${{ github.workspace }}:/workdir -w /workdir ghcr.io/jaxtonmax/hvisor-ci-base:wzm_3.0.0 tail -f /dev/null
          docker exec ${CONTAINER_NAME} rustup set auto-self-update disable
          docker exec ${CONTAINER_NAME} make fmt-test
      - if: always()
        name: Stop Container
        run: docker stop ${CONTAINER_NAME} && docker rm ${CONTAINER_NAME} || true

  # Unittest 作业
  unittest:
    name: unittest (${{ matrix.arch }} on ${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, board: "qemu-gicv3" }
          - { arch: aarch64, board: "qemu-gicv2" }
          - { arch: riscv64, board: "qemu-plic" }
          - { arch: riscv64, board: "qemu-aia" }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: 'recursive' }
      - name: Pull Image
        run: docker pull ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:wzm_3.0.0
      - name: Run Unit Test
        run: |
          CONTAINER_NAME="ci-unittest-${{ matrix.arch }}-${{ matrix.board }}"
          docker run -d --name ${CONTAINER_NAME} -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=${{ matrix.arch }} --env BOARD=${{ matrix.board }} ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:wzm_3.0.0 tail -f /dev/null
          docker exec ${CONTAINER_NAME} rustup set auto-self-update disable
          docker exec ${CONTAINER_NAME} make test
      - if: always()
        name: Stop Container
        run: docker stop ${CONTAINER_NAME} && docker rm ${CONTAINER_NAME} || true

  # Build 作业
  build:
    name: build (${{ matrix.arch }} on ${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, board: "qemu-gicv3" }
          - { arch: aarch64, board: "qemu-gicv2" }
          - { arch: aarch64, board: "zcu102" }
          - { arch: aarch64, board: "imx8mp" }
          - { arch: aarch64, board: "rk3568" }
          - { arch: aarch64, board: "rk3588" }
          - { arch: aarch64, board: "ok6254-c" }
          - { arch: riscv64, board: "qemu-aia" }
          - { arch: riscv64, board: "qemu-plic" }
          - { arch: loongarch64, board: "ls3a5000" }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: 'recursive' }
      - name: Pull Image
        run: docker pull ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:wzm_3.0.0
      - name: Run Build
        run: |
          CONTAINER_NAME="ci-build-${{ matrix.arch }}-${{ matrix.board }}"
          docker run -d --name ${CONTAINER_NAME} -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=${{ matrix.arch }} --env BOARD=${{ matrix.board }} ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:wzm_3.0.0 tail -f /dev/null
          docker exec ${CONTAINER_NAME} rustup set auto-self-update disable
          docker exec ${CONTAINER_NAME} make
      - if: always()
        name: Stop Container
        run: docker stop ${CONTAINER_NAME} && docker rm ${CONTAINER_NAME} || true

  # Systemtest 作业
  systemtest:
    name: systemtest (${{ matrix.arch }} on ${{ matrix.board }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, board: "qemu-gicv3" }
          - { arch: riscv64, board: "qemu-plic" }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: 'recursive' }
      - name: Pull Image
        run: docker pull ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:wzm_3.0.0
      - name: Run System Test
        run: |
          CONTAINER_NAME="ci-systemtest-${{ matrix.arch }}-${{ matrix.board }}"
          docker run -d --name ${CONTAINER_NAME} --cap-add=SYS_ADMIN --privileged -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=${{ matrix.arch }} --env BOARD=${{ matrix.board }} ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:wzm_3.0.0 tail -f /dev/null
          docker exec ${CONTAINER_NAME} rustup set auto-self-update disable
          docker exec ${CONTAINER_NAME} make stest
      - if: always()
        name: Stop Container
        run: docker stop ${CONTAINER_NAME} && docker rm ${CONTAINER_NAME} || true

  # License-checker 作业
  license-checker:
    name: license-checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: License Check
        run: |
          set -x
          ./tools/license_checker.sh