# hvisor Github Actions CI
# 优化版工作流：采用分层镜像、硬编码镜像路径并包含缓存命中测试

name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  # 全局环境变量，仅保留非镜像相关的配置
  RUSTUP_DIST_SERVER: "https://static.rust-lang.org"
  RUSTUP_UPDATE_ROOT: "https://static.rust-lang.org/rustup"

jobs:
  # =========================================================================
  # Linter 作业：仅需要基础环境，因此使用 base 镜像
  # =========================================================================
  linter:
    name: linter
    runs-on: ubuntu-latest
    container: ghcr.io/jaxtonmax/hvisor-ci-base:wzm_2.0.1
    steps:
      - name: Restore Docker Image Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Format Check
        run: make fmt-test

  # =========================================================================
  # Unittest 作业：根据 matrix.arch 动态选择对应的架构镜像
  # =========================================================================
  unittest:
    name: unittest (${{ matrix.arch }} on ${{ matrix.board }})
    runs-on: ubuntu-latest
    container: ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:wzm_2.0.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: aarch64
            board: "qemu-gicv2"
          - arch: riscv64
            board: "qemu-plic"
          - arch: riscv64
            board: "qemu-aia"
    steps:
      - name: Restore Docker Image Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Set up environment variables
        run: |
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "BOARD=${{ matrix.board }}" >> $GITHUB_ENV
      - name: Unit Test
        run: make test

  # =========================================================================
  # Build 作业：同样根据 matrix.arch 动态选择镜像
  # =========================================================================
  build:
    name: build (${{ matrix.arch }} on ${{ matrix.board }})
    runs-on: ubuntu-latest
    container: ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:wzm_2.0.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: aarch64
            board: "qemu-gicv2"
          - arch: aarch64
            board: "zcu102"
          - arch: aarch64
            board: "imx8mp"
          - arch: aarch64
            board: "rk3568"
          - arch: aarch64
            board: "rk3588"
          - arch: aarch64
            board: "ok6254-c"
          - arch: riscv64
            board: "qemu-aia"
          - arch: riscv64
            board: "qemu-plic"
          - arch: loongarch64
            board: "ls3a5000"
    steps:
      - name: Restore Docker Image Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Set up environment variables
        run: |
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "BOARD=${{ matrix.board }}" >> $GITHUB_ENV
      - name: Build
        run: make

  # =========================================================================
  # Systemtest 作业：动态选择镜像
  # =========================================================================
  systemtest:
    name: systemtest (${{ matrix.arch }} on ${{ matrix.board }})
    runs-on: ubuntu-22.04
    container: 
      image: ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:wzm_2.0.1
      options: --cap-add=SYS_ADMIN --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: riscv64
            board: "qemu-plic"
    steps:
      - name: Restore Docker Image Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Set up environment variables
        run: |
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "BOARD=${{ matrix.board }}" >> $GITHUB_ENV
      - name: Run System Test
        run: make stest

  # =========================================================================
  # License-checker 作业：无需容器，保持不变
  # =========================================================================
  license-checker:
    name: license-checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: License Check
        run: |
          set -x
          ./tools/license_checker.sh

  # =========================================================================
  # Cache Test 作业：显式验证缓存是否命中
  # =========================================================================
  cache-test:
    name: Verify Cache Hit
    # 此作业依赖于 linter 作业，确保在 linter 尝试保存缓存后再运行
    needs: linter
    runs-on: ubuntu-latest
    # 我们使用其中一个架构镜像来模拟真实场景的缓存测试
    container: ghcr.io/jaxtonmax/hvisor-ci-aarch64:wzm_2.0.1
    steps:
      - name: Restore Docker Image Cache
        id: cache_restore_step # 赋予步骤 ID 以便引用其输出
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Report Cache Hit Status
        run: |
          echo "=================================================="
          echo "Cache Hit Status: ${{ steps.cache_restore_step.outputs.cache-hit }}"
          echo "=================================================="
          if [[ "${{ steps.cache_restore_step.outputs.cache-hit }}" == "true" ]]; then
            echo "✅ SUCCESS: The Docker image was successfully restored from the cache."
          else
            echo "ℹ️ INFO: The Docker image was not found in the cache. This is expected on the first run of a new branch or after a manual cache clear."
          fi