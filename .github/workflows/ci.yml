# hvisor Github Actions CI
# 最终修复版：优化缓存策略以实现跨作业共享，并添加诊断步骤

name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  # =========================================================================
  # Linter 作业 (并行, 无需缓存)
  # =========================================================================
  linter:
    name: linter
    runs-on: ubuntu-latest
    container: ghcr.io/jaxtonmax/hvisor-ci-base:wzm_3.0.0
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Format Check
        run: make fmt-test

  # =========================================================================
  # Unittest 作业 (并行, 带优化缓存)
  # =========================================================================
  unittest:
    name: unittest (${{ matrix.arch }} on ${{ matrix.board }})
    runs-on: ubuntu-latest
    container: ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:wzm_3.0.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: aarch64
            board: "qemu-gicv2"
          - arch: riscv64
            board: "qemu-plic"
          - arch: riscv64
            board: "qemu-aia"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # 新增：缓存诊断步骤 1 - 验证文件并打印 Key
      - name: Prepare Cache Key
        id: prep-key
        run: |
          echo "Verifying Cargo.lock file..."
          find . -name "Cargo.lock" -exec echo "Found: {}" \;
          
          CARGO_LOCK_HASH=$(sha256sum **/Cargo.lock | awk '{ print $1 }')
          CACHE_KEY="v1-${{ runner.os }}-${{ matrix.arch }}-cargo-${CARGO_LOCK_HASH}"
          
          echo "Generated Cache Key: ${CACHE_KEY}"
          echo "key=${CACHE_KEY}" >> $GITHUB_OUTPUT

      - name: Cache Cargo and Target Directories
        id: cache-cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # 优化：Key 不再包含 board，以在相同架构的不同 board 作业间共享依赖
          key: ${{ steps.prep-key.outputs.key }}
          # 优化：恢复键也只使用架构，以最大化命中率
          restore-keys: |
            v1-${{ runner.os }}-${{ matrix.arch }}-cargo-

      # 新增：缓存诊断步骤 2 - 检查缓存命中结果
      - name: Check Cache Hit Status
        run: |
          if [ "${{ steps.cache-cargo.outputs.cache-hit }}" = "true" ]; then
            echo "✅ Cargo/target cache was successfully restored. Expect a much faster run."
          else
            echo "ℹ️ Cargo/target cache not found. A full build is expected. This is normal for the first run or after updating dependencies."
          fi

      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Set up environment variables
        run: |
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "BOARD=${{ matrix.board }}" >> $GITHUB_ENV
      - name: Unit Test
        run: make test

  # =========================================================================
  # Build 作业 (并行, 带优化缓存)
  # =========================================================================
  build:
    name: build (${{ matrix.arch }} on ${{ matrix.board }})
    runs-on: ubuntu-latest
    container: ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:wzm_3.0.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: aarch64
            board: "qemu-gicv2"
          - arch: aarch64
            board: "zcu102"
          - arch: aarch64
            board: "imx8mp"
          - arch: aarch64
            board: "rk3568"
          - arch: aarch64
            board: "rk3588"
          - arch: aarch64
            board: "ok6254-c"
          - arch: riscv64
            board: "qemu-aia"
          - arch: riscv64
            board: "qemu-plic"
          - arch: loongarch64
            board: "ls3a5000"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Prepare Cache Key
        id: prep-key
        run: |
          echo "Verifying Cargo.lock file..."
          find . -name "Cargo.lock" -exec echo "Found: {}" \;
          CARGO_LOCK_HASH=$(sha256sum **/Cargo.lock | awk '{ print $1 }')
          CACHE_KEY="v1-${{ runner.os }}-${{ matrix.arch }}-cargo-${CARGO_LOCK_HASH}"
          echo "Generated Cache Key: ${CACHE_KEY}"
          echo "key=${CACHE_KEY}" >> $GITHUB_OUTPUT

      - name: Cache Cargo and Target Directories
        id: cache-cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.prep-key.outputs.key }}
          restore-keys: |
            v1-${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Check Cache Hit Status
        run: |
          if [ "${{ steps.cache-cargo.outputs.cache-hit }}" = "true" ]; then
            echo "✅ Cargo/target cache was successfully restored. Expect a much faster run."
          else
            echo "ℹ️ Cargo/target cache not found. A full build is expected. This is normal for the first run or after updating dependencies."
          fi

      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Set up environment variables
        run: |
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "BOARD=${{ matrix.board }}" >> $GITHUB_ENV
      - name: Build
        run: make

  # =========================================================================
  # Systemtest 作业 (并行, 带优化缓存)
  # =========================================================================
  systemtest:
    name: systemtest (${{ matrix.arch }} on ${{ matrix.board }})
    runs-on: ubuntu-22.04
    container: 
      image: ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:wzm_3.0.0
      options: --cap-add=SYS_ADMIN --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: riscv64
            board: "qemu-plic"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Prepare Cache Key
        id: prep-key
        run: |
          echo "Verifying Cargo.lock file..."
          find . -name "Cargo.lock" -exec echo "Found: {}" \;
          CARGO_LOCK_HASH=$(sha256sum **/Cargo.lock | awk '{ print $1 }')
          CACHE_KEY="v1-${{ runner.os }}-${{ matrix.arch }}-cargo-${CARGO_LOCK_HASH}"
          echo "Generated Cache Key: ${CACHE_KEY}"
          echo "key=${CACHE_KEY}" >> $GITHUB_OUTPUT

      - name: Cache Cargo and Target Directories
        id: cache-cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.prep-key.outputs.key }}
          restore-keys: |
            v1-${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Check Cache Hit Status
        run: |
          if [ "${{ steps.cache-cargo.outputs.cache-hit }}" = "true" ]; then
            echo "✅ Cargo/target cache was successfully restored. Expect a much faster run."
          else
            echo "ℹ️ Cargo/target cache not found. A full build is expected. This is normal for the first run or after updating dependencies."
          fi

      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Set up environment variables
        run: |
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "BOARD=${{ matrix.board }}" >> $GITHUB_ENV
      - name: Run System Test
        run: make stest

  # =========================================================================
  # License-checker 作业 (并行, 无需缓存)
  # =========================================================================
  license-checker:
    name: license-checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: License Check
        run: |
          set -x
          ./tools/license_checker.sh