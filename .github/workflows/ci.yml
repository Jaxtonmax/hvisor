# hvisor Github Actions CI
# 此工作流已更新，通过引入缓存预备作业来加速容器启动。

name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  # 定义 CI 镜像的名称和标签，方便统一管理
  CI_IMAGE: ghcr.io/jaxtonmax/hvisor-ci:wzm_1.0.2

jobs:
  # =========================================================================
  # 步骤 1: 新增的预备作业，用于拉取和缓存 CI 镜像
  # =========================================================================
  setup-ci-environment:
    name: Setup CI Environment & Cache Image
    runs-on: ubuntu-latest
    steps:
      # 这个 Action 用于恢复/保存 Docker 层的缓存
      # 它是整个加速方案的核心
      - name: Restore Docker Layer Cache
        uses: satackey/action-docker-layer-caching@v0.1.1
        # 忽略错误，因为第一次运行时没有缓存可恢复
        continue-on-error: true

      # 拉取我们的 CI 镜像。
      # 如果缓存命中，此步骤会非常快。
      # 如果缓存未命中（第一次运行），此步骤会比较慢，但它会下载镜像，
      # 以便上面的 Action 在作业结束时能将其存入缓存。
      - name: Pull CI Image to Populate Cache
        run: docker pull ${{ env.CI_IMAGE }}

  # =========================================================================
  # 步骤 2: 修改所有现有作业，让它们依赖于预备作业
  # =========================================================================
  linter:
    name: linter
    # 新增 needs，确保此作业在 setup-ci-environment 成功后才开始
    needs: setup-ci-environment
    runs-on: ubuntu-latest
    # container 指令保持不变，但现在它会因为缓存而变得飞快
    container: ghcr.io/jaxtonmax/hvisor-ci:wzm_1.0.2
    env:
      RUSTUP_DIST_SERVER: "https://static.rust-lang.org"
      RUSTUP_UPDATE_ROOT: "https://static.rust-lang.org/rustup"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Format Check
        run: make fmt-test

  unittest:
    name: unittest
    # 新增 needs
    needs: setup-ci-environment
    runs-on: ubuntu-latest
    container: ghcr.io/jaxtonmax/hvisor-ci:wzm_1.0.2
    env:
      RUSTUP_DIST_SERVER: "https://static.rust-lang.org"
      RUSTUP_UPDATE_ROOT: "https://static.rust-lang.org/rustup"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: aarch64
            board: "qemu-gicv2"
          - arch: riscv64
            board: "qemu-plic"
          - arch: riscv64
            board: "qemu-aia"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Set up environment variables
        run: |
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "BOARD=${{ matrix.board }}" >> $GITHUB_ENV
      - name: Unit Test
        run: make test

  build:
    name: build
    # 新增 needs
    needs: setup-ci-environment
    runs-on: ubuntu-latest
    container: ghcr.io/jaxtonmax/hvisor-ci:wzm_1.0.2
    env:
      RUSTUP_DIST_SERVER: "https://static.rust-lang.org"
      RUSTUP_UPDATE_ROOT: "https://static.rust-lang.org/rustup"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: aarch64
            board: "qemu-gicv2"
          - arch: aarch64
            board: "zcu102"
          - arch: aarch64
            board: "imx8mp"
          - arch: aarch64
            board: "rk3568"
          - arch: aarch64
            board: "rk3588"
          - arch: aarch64
            board: "ok6254-c"
          - arch: riscv64
            board: "qemu-aia"
          - arch: riscv64
            board: "qemu-plic"
          - arch: loongarch64
            board: "ls3a5000"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Set up environment variables
        run: |
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "BOARD=${{ matrix.board }}" >> $GITHUB_ENV
      - name: Build
        run: make

  systemtest:
    name: systemtest
    # 新增 needs
    needs: setup-ci-environment
    runs-on: ubuntu-22.04
    container: 
      image: ghcr.io/jaxtonmax/hvisor-ci:wzm_1.0.2
      options: --cap-add=SYS_ADMIN --privileged
    env:
      RUSTUP_DIST_SERVER: "https://static.rust-lang.org"
      RUSTUP_UPDATE_ROOT: "https://static.rust-lang.org/rustup"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: riscv64
            board: "qemu-plic"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Set up environment variables
        run: |
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          "BOARD=${{ matrix.board }}" >> $GITHUB_ENV
      - name: Run System Test
        run: make stest

  # 此作业很轻量，可以不依赖缓存，保持不变以快速获得反馈
  license-checker:
    name: license-checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: License Check
        run: |
          set -x
          ./tools/license_checker.sh