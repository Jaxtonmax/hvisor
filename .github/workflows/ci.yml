# hvisor Github Actions CI - 最终、完整、健壮的版本

name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  # 我们给动态构建的镜像一个统一的标签
  CI_IMAGE_TAG: hvisor-ci:wzm_1.1.0
  QEMU_VERSION: 9.0.2
  QEMU_TARBALL: qemu-9.0.2.tar.xz

jobs:
  # Linter 作业
  linter:
    name: linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            toolchains
            ${{ env.QEMU_TARBALL }}
          key: ${{ runner.os }}-deps-${{ hashFiles('toolchains/**') }}-${{ env.QEMU_VERSION }}
      - name: Download QEMU Source (if not cached)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: curl -fSL --retry 5 -o ${{ env.QEMU_TARBALL }} "https://download.qemu.org/qemu-${{ env.QEMU_VERSION }}.tar.xz"
      - name: Build CI Docker Image
        run: docker build -t ${{ env.CI_IMAGE_TAG }} -f Dockerfile.1.1.0 .
      - name: Run Linter Check
        run: docker run --rm -v ${{ github.workspace }}:/workdir ${{ env.CI_IMAGE_TAG }} make fmt-test

  # Unittest 作业
  unittest:
    name: unittest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: aarch64
            board: "qemu-gicv2"
          - arch: riscv64
            board: "qemu-plic"
          - arch: riscv64
            board: "qemu-aia"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            toolchains
            ${{ env.QEMU_TARBALL }}
          key: ${{ runner.os }}-deps-${{ hashFiles('toolchains/**') }}-${{ env.QEMU_VERSION }}
      - name: Download QEMU Source (if not cached)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: curl -fSL --retry 5 -o ${{ env.QEMU_TARBALL }} "https://download.qemu.org/qemu-${{ env.QEMU_VERSION }}.tar.xz"
      - name: Build CI Docker Image
        run: docker build -t ${{ env.CI_IMAGE_TAG }} -f Dockerfile.1.1.0 .
      - name: Run Unit Test
        run: docker run --rm -v ${{ github.workspace }}:/workdir -e ARCH=${{ matrix.arch }} -e BOARD=${{ matrix.board }} ${{ env.CI_IMAGE_TAG }} make test

  # Build 作业
  build:
    name: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: aarch64
            board: "zcu102"
          - arch: riscv64
            board: "qemu-plic"
          - arch: loongarch64
            board: "ls3a5000"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            toolchains
            ${{ env.QEMU_TARBALL }}
          key: ${{ runner.os }}-deps-${{ hashFiles('toolchains/**') }}-${{ env.QEMU_VERSION }}
      - name: Download QEMU Source (if not cached)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: curl -fSL --retry 5 -o ${{ env.QEMU_TARBALL }} "https://download.qemu.org/qemu-${{ env.QEMU_VERSION }}.tar.xz"
      - name: Build CI Docker Image
        run: docker build -t ${{ env.CI_IMAGE_TAG }} -f Dockerfile.1.1.0 .
      - name: Run Build
        run: docker run --rm -v ${{ github.workspace }}:/workdir -e ARCH=${{ matrix.arch }} -e BOARD=${{ matrix.board }} ${{ env.CI_IMAGE_TAG }} make

  # Systemtest 作业 (已补全并修正)
  systemtest:
    name: systemtest
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: riscv64
            board: "qemu-plic"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            toolchains
            ${{ env.QEMU_TARBALL }}
          key: ${{ runner.os }}-deps-${{ hashFiles('toolchains/**') }}-${{ env.QEMU_VERSION }}
      - name: Download QEMU Source (if not cached)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: curl -fSL --retry 5 -o ${{ env.QEMU_TARBALL }} "https://download.qemu.org/qemu-${{ env.QEMU_VERSION }}.tar.xz"
      - name: Build CI Docker Image
        run: docker build -t ${{ env.CI_IMAGE_TAG }} -f Dockerfile.1.1.0 .
      - name: Run System Test
        run: docker run --rm --privileged --cap-add=SYS_ADMIN -v ${{ github.workspace }}:/workdir -e ARCH=${{ matrix.arch }} -e BOARD=${{ matrix.board }} ${{ env.CI_IMAGE_TAG }} make stest

  # License-checker 作业 (保持不变)
  license-checker:
    name: license-checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: License Check
        run: |
          set -x
          ./tools/license_checker.sh