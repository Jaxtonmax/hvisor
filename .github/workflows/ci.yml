# =========================================================================
# hvisor Github Actions CI (v3.3 - 简化镜像依赖与缓存策略)
#
# - 核心优化: 移除对 hvisor-ci-base 镜像的直接依赖。
# - 策略变更: linter 作业现在使用最小的架构镜像 (hvisor-ci-aarch64)，
#   因为它已包含 base 的所有功能。
# - 缓存效率: 减少了需要缓存的独立镜像数量，linter 和 aarch64 作业
#   将共享同一个缓存，提高了缓存命中率。
# - 明确预期: 此修改将使 aarch64 和 riscv64 作业的缓存生效并大幅提速。
#   loongarch64 作业因其自身体积问题仍会较慢，但这不再影响其他作业。
# =========================================================================

name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  CONTAINER_NAME: ci-container
  IMAGE_VERSION: wzm_3.0.0

jobs:
  # =========================================================================
  # Linter 作业 (使用 aarch64 镜像)
  # =========================================================================
  linter:
    name: linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Restore Docker Layer Cache for aarch64
        uses: satackey/action-docker-layer-caching@v0.0.11
        with:
          key: docker-cache-aarch64-${{ runner.os }}
        continue-on-error: true

      - name: Pull aarch64 Image (for Linter)
        run: |
          IMAGE_NAME="ghcr.io/jaxtonmax/hvisor-ci-aarch64:${{ env.IMAGE_VERSION }}"
          echo "Pulling image for linter: ${IMAGE_NAME}"
          docker pull ${IMAGE_NAME}

      - name: Run Container in Background
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} \
            -v ${{ github.workspace }}:/workdir \
            -w /workdir \
            ghcr.io/jaxtonmax/hvisor-ci-aarch64:${{ env.IMAGE_VERSION }} \
            tail -f /dev/null

      - name: Run Linter Tasks
        run: |
          docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
          docker exec ${{ env.CONTAINER_NAME }} make fmt-test

      - name: Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

  # =========================================================================
  # Unittest 作业 (使用各自的架构镜像)
  # =========================================================================
  unittest:
    name: unittest (${{ matrix.arch }} on ${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: aarch64
            board: "qemu-gicv2"
          - arch: riscv64
            board: "qemu-plic"
          - arch: riscv64
            board: "qemu-aia"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Restore Docker Layer Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        with:
          key: docker-cache-${{ matrix.arch }}-${{ runner.os }}
        continue-on-error: true

      - name: Pull Arch Image
        run: |
          IMAGE_NAME="ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:${{ env.IMAGE_VERSION }}"
          echo "Pulling image: ${IMAGE_NAME}"
          docker pull ${IMAGE_NAME}

      - name: Run Container in Background
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} \
            -v ${{ github.workspace }}:/workdir \
            -w /workdir \
            --env ARCH=${{ matrix.arch }} \
            --env BOARD=${{ matrix.board }} \
            ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:${{ env.IMAGE_VERSION }} \
            tail -f /dev/null

      - name: Run Unit Test
        run: |
          docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
          docker exec ${{ env.CONTAINER_NAME }} make test

      - name: Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

  # =========================================================================
  # Build 作业 (使用各自的架构镜像)
  # =========================================================================
  build:
    name: build (${{ matrix.arch }} on ${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: aarch64
            board: "qemu-gicv2"
          - arch: aarch64
            board: "zcu102"
          - arch: aarch64
            board: "imx8mp"
          - arch: aarch64
            board: "rk3568"
          - arch: aarch64
            board: "rk3588"
          - arch: aarch64
            board: "ok6254-c"
          - arch: riscv64
            board: "qemu-aia"
          - arch: riscv64
            board: "qemu-plic"
          - arch: loongarch64
            board: "ls3a5000"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Restore Docker Layer Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        with:
          key: docker-cache-${{ matrix.arch }}-${{ runner.os }}
        continue-on-error: true

      - name: Pull Arch Image
        run: |
          IMAGE_NAME="ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:${{ env.IMAGE_VERSION }}"
          echo "Pulling image: ${IMAGE_NAME}"
          docker pull ${IMAGE_NAME}

      - name: Run Container in Background
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} \
            -v ${{ github.workspace }}:/workdir \
            -w /workdir \
            --env ARCH=${{ matrix.arch }} \
            --env BOARD=${{ matrix.board }} \
            ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:${{ env.IMAGE_VERSION }} \
            tail -f /dev/null

      - name: Build
        run: |
          docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
          docker exec ${{ env.CONTAINER_NAME }} make

      - name: Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

  # =========================================================================
  # Systemtest 作业 (使用各自的架构镜像)
  # =========================================================================
  systemtest:
    name: systemtest (${{ matrix.arch }} on ${{ matrix.board }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: riscv64
            board: "qemu-plic"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Restore Docker Layer Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        with:
          key: docker-cache-${{ matrix.arch }}-${{ runner.os }}
        continue-on-error: true

      - name: Pull Arch Image
        run: |
          IMAGE_NAME="ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:${{ env.IMAGE_VERSION }}"
          echo "Pulling image: ${IMAGE_NAME}"
          docker pull ${IMAGE_NAME}

      - name: Run Container in Background with Privileges
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} \
            --cap-add=SYS_ADMIN --privileged \
            -v ${{ github.workspace }}:/workdir \
            -w /workdir \
            --env ARCH=${{ matrix.arch }} \
            --env BOARD=${{ matrix.board }} \
            ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:${{ env.IMAGE_VERSION }} \
            tail -f /dev/null

      - name: Run System Test
        run: |
          docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
          docker exec ${{ env.CONTAINER_NAME }} make stest

      - name: Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

  # =========================================================================
  # License-checker 作业 (保持不变)
  # =========================================================================
  license-checker:
    name: license-checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: License Check
        run: |
          set -x
          ./tools/license_checker.sh