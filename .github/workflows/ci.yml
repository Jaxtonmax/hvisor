# hvisor Github Actions CI
# 此工作流已更新为正确的缓存模式：每个作业独立管理自己的容器缓存。

name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  CI_IMAGE: ghcr.io/jaxtonmax/hvisor-ci:wzm_1.0.2

jobs:
  # =========================================================================
  # 移除了 setup-ci-environment 作业
  # 将缓存逻辑直接集成到每个需要容器的作业中
  # =========================================================================
  linter:
    name: linter
    runs-on: ubuntu-latest
    container: ghcr.io/jaxtonmax/hvisor-ci:wzm_1.0.2
    env:
      RUSTUP_DIST_SERVER: "https://static.rust-lang.org"
      RUSTUP_UPDATE_ROOT: "https://static.rust-lang.org/rustup"
    steps:
      # 在每个作业的开始，都执行缓存恢复操作
      - name: Restore Docker Layer Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Format Check
        run: make fmt-test

  unittest:
    name: unittest
    runs-on: ubuntu-latest
    container: ghcr.io/jaxtonmax/hvisor-ci:wzm_1.0.2
    env:
      RUSTUP_DIST_SERVER: "https://static.rust-lang.org"
      RUSTUP_UPDATE_ROOT: "https://static.rust-lang.org/rustup"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: aarch64
            board: "qemu-gicv2"
          - arch: riscv64
            board: "qemu-plic"
          - arch: riscv64
            board: "qemu-aia"
    steps:
      - name: Restore Docker Layer Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Set up environment variables
        run: |
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "BOARD=${{ matrix.board }}" >> $GITHUB_ENV
      - name: Unit Test
        run: make test

  build:
    name: build
    runs-on: ubuntu-latest
    container: ghcr.io/jaxtonmax/hvisor-ci:wzm_1.0.2
    env:
      RUSTUP_DIST_SERVER: "https://static.rust-lang.org"
      RUSTUP_UPDATE_ROOT: "https://static.rust-lang.org/rustup"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: aarch64
            board: "qemu-gicv2"
          - arch: aarch64
            board: "zcu102"
          - arch: aarch64
            board: "imx8mp"
          - arch: aarch64
            board: "rk3568"
          - arch: aarch64
            board: "rk3588"
          - arch: aarch64
            board: "ok6254-c"
          - arch: riscv64
            board: "qemu-aia"
          - arch: riscv64
            board: "qemu-plic"
          - arch: loongarch64
            board: "ls3a5000"
    steps:
      - name: Restore Docker Layer Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Set up environment variables
        run: |
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "BOARD=${{ matrix.board }}" >> $GITHUB_ENV
      - name: Build
        run: make
# tijiao
  systemtest:
    name: systemtest
    runs-on: ubuntu-22.04
    container: 
      image: ghcr.io/jaxtonmax/hvisor-ci:wzm_1.0.2
      options: --cap-add=SYS_ADMIN --privileged
    env:
      RUSTUP_DIST_SERVER: "https://static.rust-lang.org"
      RUSTUP_UPDATE_ROOT: "https://static.rust-lang.org/rustup"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: riscv64
            board: "qemu-plic"
    steps:
      - name: Restore Docker Layer Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Set up environment variables
        run: |
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "BOARD=${{ matrix.board }}" >> $GITHUB_ENV
      - name: Run System Test
        run: make stest

  # 此作业很轻量，不需要容器，所以不需要缓存
  license-checker:
    name: license-checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: License Check
        run: |
          set -x
          ./tools/license_checker.sh