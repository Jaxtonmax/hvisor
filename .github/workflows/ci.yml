# hvisor Github Actions CI
# 最终优化版：使用指定的、独立的架构镜像，并包含缓存命中测试

name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

# 全局环境变量，移除了镜像相关的变量
env:
  RUSTUP_DIST_SERVER: "https://static.rust-lang.org"
  RUSTUP_UPDATE_ROOT: "https://static.rust-lang.org/rustup"

jobs:
  # =========================================================================
  # Linter 作业：使用指定版本的 base 镜像
  # =========================================================================
  linter:
    name: linter
    runs-on: ubuntu-latest
    container: ghcr.io/jaxtonmax/hvisor-ci-base:wzm_2.0.1
    steps:
      # 步骤 1: 恢复 Docker 镜像缓存，并为步骤设置 id 以便引用其输出
      - name: Restore Docker Image Cache
        id: cache-docker-image
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      # 步骤 2: 新增 - 检查并报告缓存是否命中
      - name: Check Cache Hit Status
        run: |
          echo "Cache hit status: ${{ steps.cache-docker-image.outputs.cache-hit }}"
          if [ "${{ steps.cache-docker-image.outputs.cache-hit }}" = "true" ]; then
            echo "✅ Docker image cache was successfully restored."
          else
            echo "ℹ️ Docker image cache not found. A full image pull is expected."
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Format Check
        run: make fmt-test

  # =========================================================================
  # Unittest 作业：根据 matrix 动态选择镜像，并指定每个架构的正确标签
  # =========================================================================
  unittest:
    name: unittest (${{ matrix.arch }} on ${{ matrix.board }})
    runs-on: ubuntu-latest
    # 动态拼接镜像名称和从 matrix 中获取的特定标签
    container: ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:${{ matrix.image_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # aarch64 使用 2.0.2 标签
          - arch: aarch64
            board: "qemu-gicv3"
            image_tag: "2.0.2"
          - arch: aarch64
            board: "qemu-gicv2"
            image_tag: "2.0.2"
          # riscv64 使用 wzm_2.0.2 标签
          - arch: riscv64
            board: "qemu-plic"
            image_tag: "wzm_2.0.2"
          - arch: riscv64
            board: "qemu-aia"
            image_tag: "wzm_2.0.2"
    steps:
      - name: Restore Docker Image Cache
        id: cache-docker-image
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Check Cache Hit Status
        run: |
          echo "Cache hit status: ${{ steps.cache-docker-image.outputs.cache-hit }}"
          if [ "${{ steps.cache-docker-image.outputs.cache-hit }}" = "true" ]; then
            echo "✅ Docker image cache was successfully restored."
          else
            echo "ℹ️ Docker image cache not found. A full image pull is expected."
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Set up environment variables
        run: |
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "BOARD=${{ matrix.board }}" >> $GITHUB_ENV
      - name: Unit Test
        run: make test

  # =========================================================================
  # Build 作业：同样根据 matrix 动态选择镜像和标签
  # =========================================================================
  build:
    name: build (${{ matrix.arch }} on ${{ matrix.board }})
    runs-on: ubuntu-latest
    container: ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:${{ matrix.image_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
            image_tag: "2.0.2"
          - arch: aarch64
            board: "qemu-gicv2"
            image_tag: "2.0.2"
          - arch: aarch64
            board: "zcu102"
            image_tag: "2.0.2"
          - arch: aarch64
            board: "imx8mp"
            image_tag: "2.0.2"
          - arch: aarch64
            board: "rk3568"
            image_tag: "2.0.2"
          - arch: aarch64
            board: "rk3588"
            image_tag: "2.0.2"
          - arch: aarch64
            board: "ok6254-c"
            image_tag: "2.0.2"
          - arch: riscv64
            board: "qemu-aia"
            image_tag: "wzm_2.0.2"
          - arch: riscv64
            board: "qemu-plic"
            image_tag: "wzm_2.0.2"
          - arch: loongarch64
            board: "ls3a5000"
            image_tag: "2.0.2"
    steps:
      - name: Restore Docker Image Cache
        id: cache-docker-image
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Check Cache Hit Status
        run: |
          echo "Cache hit status: ${{ steps.cache-docker-image.outputs.cache-hit }}"
          if [ "${{ steps.cache-docker-image.outputs.cache-hit }}" = "true" ]; then
            echo "✅ Docker image cache was successfully restored."
          else
            echo "ℹ️ Docker image cache not found. A full image pull is expected."
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Set up environment variables
        run: |
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "BOARD=${{ matrix.board }}" >> $GITHUB_ENV
      - name: Build
        run: make

  # =========================================================================
  # Systemtest 作业：动态选择镜像和标签
  # =========================================================================
  systemtest:
    name: systemtest (${{ matrix.arch }} on ${{ matrix.board }})
    runs-on: ubuntu-22.04
    container: 
      image: ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:${{ matrix.image_tag }}
      options: --cap-add=SYS_ADMIN --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
            image_tag: "2.0.2"
          - arch: riscv64
            board: "qemu-plic"
            image_tag: "wzm_2.0.2"
    steps:
      - name: Restore Docker Image Cache
        id: cache-docker-image
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Check Cache Hit Status
        run: |
          echo "Cache hit status: ${{ steps.cache-docker-image.outputs.cache-hit }}"
          if [ "${{ steps.cache-docker-image.outputs.cache-hit }}" = "true" ]; then
            echo "✅ Docker image cache was successfully restored."
          else
            echo "ℹ️ Docker image cache not found. A full image pull is expected."
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Set up environment variables
        run: |
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "BOARD=${{ matrix.board }}" >> $GITHUB_ENV
      - name: Run System Test
        run: |
          # 关键修复：重建 PATH 环境变量，将系统路径放在最前面
          # 这确保了 'gcc' 解析为 /usr/bin/gcc，解决了 GLIBC 冲突
          # 同时交叉编译器 'aarch64-none-linux-gnu-gcc' 仍然可以在 /opt/toolchain/bin 中被找到
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH}"
          
          echo "--- Verifying GCC paths ---"
          echo "Native GCC used by system:"
          which gcc
          gcc --version
          
          echo "Cross-compiler used for kernel modules:"
          which ${{ matrix.cross_compile }}gcc
          ${{ matrix.cross_compile }}gcc --version
          echo "---------------------------"

          make stest

  # =========================================================================
  # License-checker 作业：无需容器和缓存，保持不变
  # =========================================================================
  license-checker:
    name: license-checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: License Check
        run: |
          set -x
          ./tools/license_checker.sh