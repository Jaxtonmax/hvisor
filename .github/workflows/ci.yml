# hvisor Github Actions CI
# 最终版：集成分层镜像、动态容器选择，并包含明确的缓存命中验证步骤

name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  # 定义镜像仓库和标签，方便统一管理
  IMAGE_REGISTRY: ghcr.io/jaxtonmax
  BASE_IMAGE_TAG: wzm_2.0.1
  ARCH_IMAGE_TAG: wzm_2.0.1 # 假设新镜像也使用此标签
  RUSTUP_DIST_SERVER: "https://static.rust-lang.org"
  RUSTUP_UPDATE_ROOT: "https://static.rust-lang.org/rustup"

jobs:
  # =========================================================================
  # Linter 作业：仅需要基础环境，因此使用 base 镜像
  # =========================================================================
  linter:
    name: linter
    runs-on: ubuntu-latest
    container: ${{ env.IMAGE_REGISTRY }}/hvisor-ci-base:${{ env.BASE_IMAGE_TAG }}
    steps:
      # 步骤 1: 尝试从缓存恢复镜像，并为这个步骤设置 ID
      - name: Restore Docker Image Cache
        id: docker_cache # <-- 添加 ID 以便后续步骤引用
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      # 步骤 2: 【新增】验证缓存是否命中
      - name: Verify Cache Hit
        run: |
          if [ "${{ steps.docker_cache.outputs.cache-hit }}" = "true" ]; then
            echo "✅✅✅ Linter: Cache hit! Image was successfully restored from cache."
          else
            echo "⚠️⚠️⚠️ Linter: Cache miss. Image will be pulled from the registry."
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Format Check
        run: make fmt-test

  # =========================================================================
  # Unittest 作业：根据 matrix.arch 动态选择对应的架构镜像
  # =========================================================================
  unittest:
    name: unittest (${{ matrix.arch }} on ${{ matrix.board }})
    runs-on: ubuntu-latest
    container: ${{ env.IMAGE_REGISTRY }}/hvisor-ci-${{ matrix.arch }}:${{ env.ARCH_IMAGE_TAG }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: aarch64
            board: "qemu-gicv2"
          - arch: riscv64
            board: "qemu-plic"
          - arch: riscv64
            board: "qemu-aia"
    steps:
      - name: Restore Docker Image Cache
        id: docker_cache # <-- 添加 ID
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Verify Cache Hit
        run: |
          if [ "${{ steps.docker_cache.outputs.cache-hit }}" = "true" ]; then
            echo "✅✅✅ Unittest (${{ matrix.arch }}): Cache hit! Image was successfully restored from cache."
          else
            echo "⚠️⚠️⚠️ Unittest (${{ matrix.arch }}): Cache miss. Image will be pulled from the registry."
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Set up environment variables
        run: |
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "BOARD=${{ matrix.board }}" >> $GITHUB_ENV
      - name: Unit Test
        run: make test

  # =========================================================================
  # Build 作业：同样根据 matrix.arch 动态选择镜像
  # =========================================================================
  build:
    name: build (${{ matrix.arch }} on ${{ matrix.board }})
    runs-on: ubuntu-latest
    container: ${{ env.IMAGE_REGISTRY }}/hvisor-ci-${{ matrix.arch }}:${{ env.ARCH_IMAGE_TAG }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: aarch64
            board: "qemu-gicv2"
          - arch: aarch64
            board: "zcu102"
          - arch: aarch64
            board: "imx8mp"
          - arch: aarch64
            board: "rk3568"
          - arch: aarch64
            board: "rk3588"
          - arch: aarch64
            board: "ok6254-c"
          - arch: riscv64
            board: "qemu-aia"
          - arch: riscv64
            board: "qemu-plic"
          - arch: loongarch64
            board: "ls3a5000"
    steps:
      - name: Restore Docker Image Cache
        id: docker_cache # <-- 添加 ID
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Verify Cache Hit
        run: |
          if [ "${{ steps.docker_cache.outputs.cache-hit }}" = "true" ]; then
            echo "✅✅✅ Build (${{ matrix.arch }}): Cache hit! Image was successfully restored from cache."
          else
            echo "⚠️⚠️⚠️ Build (${{ matrix.arch }}): Cache miss. Image will be pulled from the registry."
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Set up environment variables
        run: |
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "BOARD=${{ matrix.board }}" >> $GITHUB_ENV
      - name: Build
        run: make

  # =========================================================================
  # Systemtest 作业：动态选择镜像
  # =========================================================================
  systemtest:
    name: systemtest (${{ matrix.arch }} on ${{ matrix.board }})
    runs-on: ubuntu-22.04
    container: 
      image: ${{ env.IMAGE_REGISTRY }}/hvisor-ci-${{ matrix.arch }}:${{ env.ARCH_IMAGE_TAG }}
      options: --cap-add=SYS_ADMIN --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: riscv64
            board: "qemu-plic"
    steps:
      - name: Restore Docker Image Cache
        id: docker_cache # <-- 添加 ID
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Verify Cache Hit
        run: |
          if [ "${{ steps.docker_cache.outputs.cache-hit }}" = "true" ]; then
            echo "✅✅✅ Systemtest (${{ matrix.arch }}): Cache hit! Image was successfully restored from cache."
          else
            echo "⚠️⚠️⚠️ Systemtest (${{ matrix.arch }}): Cache miss. Image will be pulled from the registry."
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Disable rustup auto update
        run: rustup set auto-self-update disable
      - name: Set up environment variables
        run: |
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "BOARD=${{ matrix.board }}" >> $GITHUB_ENV
      - name: Run System Test
        run: make stest

  # =========================================================================
  # License-checker 作业：无需容器，保持不变
  # =========================================================================
  license-checker:
    name: license-checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: License Check
        run: |
          set -x
          ./tools/license_checker.sh