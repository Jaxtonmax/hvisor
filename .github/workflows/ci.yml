# =========================================================================
# hvisor Github Actions CI (v9.0 - 生产就绪版)
#
# - 缓存策略:
#   1. [全面应用] 为所有使用 aarch64 镜像的作业 (linter, build, unittest, systemtest)
#      启用并共享同一个缓存，使用统一的 cache key。
#   2. [保持禁用] riscv64 和 loongarch64 作业保持无缓存策略，以避免超出总配额。
# - 前提: 必须先修复代码格式问题，确保 linter 作业能成功通过，以便首次创建缓存。
# =========================================================================

name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  CONTAINER_NAME: ci-container
  IMAGE_VERSION: wzm_3.0.0

jobs:
  # =========================================================================
  # Linter 作业 (aarch64, 启用缓存)
  # =========================================================================
  linter:
    name: linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: 'recursive' }

      - name: Set up Cache Paths and Keys for aarch64
        id: cache-setup-aarch64
        run: |
          IMAGE_NAME="ghcr.io/jaxtonmax/hvisor-ci-aarch64:${{ env.IMAGE_VERSION }}"
          SANITIZED_IMAGE_NAME=$(echo ${IMAGE_NAME} | sed 's|[:/]|_-_|g')
          echo "IMAGE_TAR_PATH=image_${SANITIZED_IMAGE_NAME}.tar" >> $GITHUB_ENV
          echo "CACHE_KEY=docker-cache-${SANITIZED_IMAGE_NAME}-${{ runner.os }}" >> $GITHUB_ENV

      - name: Restore Cached aarch64 Image
        uses: actions/cache@v4
        id: cache-restore-aarch64
        with:
          path: ${{ env.IMAGE_TAR_PATH }}
          key: ${{ env.CACHE_KEY }}

      - name: Load/Pull aarch64 Image
        run: |
          if [[ "${{ steps.cache-restore-aarch64.outputs.cache-hit }}" == "true" ]]; then
            echo "Cache hit! Loading Docker image..."
            docker load -i ${{ env.IMAGE_TAR_PATH }}
          else
            echo "Cache miss. Pulling and saving Docker image..."
            docker pull ghcr.io/jaxtonmax/hvisor-ci-aarch64:${{ env.IMAGE_VERSION }}
            docker save ghcr.io/jaxtonmax/hvisor-ci-aarch64:${{ env.IMAGE_VERSION }} -o ${{ env.IMAGE_TAR_PATH }}
          fi

      - name: Run Linter Tasks
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} -v ${{ github.workspace }}:/workdir -w /workdir ghcr.io/jaxtonmax/hvisor-ci-aarch64:${{ env.IMAGE_VERSION }} tail -f /dev/null
          docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
          docker exec ${{ env.CONTAINER_NAME }} make fmt-test

      - name: Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }} || true

  # =========================================================================
  # Unittest 作业
  # =========================================================================
  unittest-aarch64:
    name: unittest (aarch64 on ${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { board: ["qemu-gicv3", "qemu-gicv2"] } }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: 'recursive' }
      - name: Set up Cache Paths and Keys for aarch64
        run: |
          IMAGE_NAME="ghcr.io/jaxtonmax/hvisor-ci-aarch64:${{ env.IMAGE_VERSION }}"
          SANITIZED_IMAGE_NAME=$(echo ${IMAGE_NAME} | sed 's|[:/]|_-_|g')
          echo "IMAGE_TAR_PATH=image_${SANITIZED_IMAGE_NAME}.tar" >> $GITHUB_ENV
          echo "CACHE_KEY=docker-cache-${SANITIZED_IMAGE_NAME}-${{ runner.os }}" >> $GITHUB_ENV
      - name: Restore Cached aarch64 Image
        uses: actions/cache@v4
        id: cache-restore-aarch64
        with: { path: '${{ env.IMAGE_TAR_PATH }}', key: '${{ env.CACHE_KEY }}' }
      - name: Load/Pull aarch64 Image
        run: |
          if [[ "${{ steps.cache-restore-aarch64.outputs.cache-hit }}" == "true" ]]; then
            docker load -i ${{ env.IMAGE_TAR_PATH }}
          else
            docker pull ghcr.io/jaxtonmax/hvisor-ci-aarch64:${{ env.IMAGE_VERSION }}
            docker save ghcr.io/jaxtonmax/hvisor-ci-aarch64:${{ env.IMAGE_VERSION }} -o ${{ env.IMAGE_TAR_PATH }}
          fi
      - name: Run Unit Test
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=aarch64 --env BOARD=${{ matrix.board }} ghcr.io/jaxtonmax/hvisor-ci-aarch64:${{ env.IMAGE_VERSION }} tail -f /dev/null
          docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
          docker exec ${{ env.CONTAINER_NAME }} make test
      - if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }} || true

  unittest-riscv64:
    name: unittest (riscv64 on ${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { board: ["qemu-plic", "qemu-aia"] } }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: 'recursive' }
      - name: Pull riscv64 Image (No Cache)
        run: docker pull ghcr.io/jaxtonmax/hvisor-ci-riscv64:${{ env.IMAGE_VERSION }}
      - name: Run Unit Test
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=riscv64 --env BOARD=${{ matrix.board }} ghcr.io/jaxtonmax/hvisor-ci-riscv64:${{ env.IMAGE_VERSION }} tail -f /dev/null
          docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
          docker exec ${{ env.CONTAINER_NAME }} make test
      - if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }} || true

  # =========================================================================
  # Build 作业
  # =========================================================================
  build-aarch64:
    name: build (aarch64 on ${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { board: ["qemu-gicv3", "qemu-gicv2", "zcu102", "imx8mp", "rk3568", "rk3588", "ok6254-c"] } }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: 'recursive' }
      - name: Set up Cache Paths and Keys for aarch64
        run: |
          IMAGE_NAME="ghcr.io/jaxtonmax/hvisor-ci-aarch64:${{ env.IMAGE_VERSION }}"
          SANITIZED_IMAGE_NAME=$(echo ${IMAGE_NAME} | sed 's|[:/]|_-_|g')
          echo "IMAGE_TAR_PATH=image_${SANITIZED_IMAGE_NAME}.tar" >> $GITHUB_ENV
          echo "CACHE_KEY=docker-cache-${SANITIZED_IMAGE_NAME}-${{ runner.os }}" >> $GITHUB_ENV
      - name: Restore Cached aarch64 Image
        uses: actions/cache@v4
        id: cache-restore-aarch64
        with: { path: '${{ env.IMAGE_TAR_PATH }}', key: '${{ env.CACHE_KEY }}' }
      - name: Load/Pull aarch64 Image
        run: |
          if [[ "${{ steps.cache-restore-aarch64.outputs.cache-hit }}" == "true" ]]; then
            docker load -i ${{ env.IMAGE_TAR_PATH }}
          else
            docker pull ghcr.io/jaxtonmax/hvisor-ci-aarch64:${{ env.IMAGE_VERSION }}
            docker save ghcr.io/jaxtonmax/hvisor-ci-aarch64:${{ env.IMAGE_VERSION }} -o ${{ env.IMAGE_TAR_PATH }}
          fi
      - name: Build
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=aarch64 --env BOARD=${{ matrix.board }} ghcr.io/jaxtonmax/hvisor-ci-aarch64:${{ env.IMAGE_VERSION }} tail -f /dev/null
          docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
          docker exec ${{ env.CONTAINER_NAME }} make
      - if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }} || true

  build-riscv64:
    name: build (riscv64 on ${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { board: ["qemu-aia", "qemu-plic"] } }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: 'recursive' }
      - name: Pull riscv64 Image (No Cache)
        run: docker pull ghcr.io/jaxtonmax/hvisor-ci-riscv64:${{ env.IMAGE_VERSION }}
      - name: Build
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=riscv64 --env BOARD=${{ matrix.board }} ghcr.io/jaxtonmax/hvisor-ci-riscv64:${{ env.IMAGE_VERSION }} tail -f /dev/null
          docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
          docker exec ${{ env.CONTAINER_NAME }} make
      - if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }} || true

  build-loongarch64:
    name: build (loongarch64 on ls3a5000)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: 'recursive' }
      - name: Pull LoongArch Image (No Cache)
        run: docker pull ghcr.io/jaxtonmax/hvisor-ci-loongarch64:${{ env.IMAGE_VERSION }}
      - name: Build
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=loongarch64 --env BOARD=ls3a5000 ghcr.io/jaxtonmax/hvisor-ci-loongarch64:${{ env.IMAGE_VERSION }} tail -f /dev/null
          docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
          docker exec ${{ env.CONTAINER_NAME }} make
      - if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }} || true

  # =========================================================================
  # Systemtest 作业
  # =========================================================================
  systemtest-aarch64:
    name: systemtest (aarch64 on qemu-gicv3)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: 'recursive' }
      - name: Set up Cache Paths and Keys for aarch64
        run: |
          IMAGE_NAME="ghcr.io/jaxtonmax/hvisor-ci-aarch64:${{ env.IMAGE_VERSION }}"
          SANITIZED_IMAGE_NAME=$(echo ${IMAGE_NAME} | sed 's|[:/]|_-_|g')
          echo "IMAGE_TAR_PATH=image_${SANITIZED_IMAGE_NAME}.tar" >> $GITHUB_ENV
          echo "CACHE_KEY=docker-cache-${SANITIZED_IMAGE_NAME}-${{ runner.os }}" >> $GITHUB_ENV
      - name: Restore Cached aarch64 Image
        uses: actions/cache@v4
        id: cache-restore-aarch64
        with: { path: '${{ env.IMAGE_TAR_PATH }}', key: '${{ env.CACHE_KEY }}' }
      - name: Load/Pull aarch64 Image
        run: |
          if [[ "${{ steps.cache-restore-aarch64.outputs.cache-hit }}" == "true" ]]; then
            docker load -i ${{ env.IMAGE_TAR_PATH }}
          else
            docker pull ghcr.io/jaxtonmax/hvisor-ci-aarch64:${{ env.IMAGE_VERSION }}
            docker save ghcr.io/jaxtonmax/hvisor-ci-aarch64:${{ env.IMAGE_VERSION }} -o ${{ env.IMAGE_TAR_PATH }}
          fi
      - name: Run System Test
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} --cap-add=SYS_ADMIN --privileged -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=aarch64 --env BOARD=qemu-gicv3 ghcr.io/jaxtonmax/hvisor-ci-aarch64:${{ env.IMAGE_VERSION }} tail -f /dev/null
          docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
          docker exec ${{ env.CONTAINER_NAME }} make stest
      - if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }} || true

  systemtest-riscv64:
    name: systemtest (riscv64 on qemu-plic)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: 'recursive' }
      - name: Pull riscv64 Image (No Cache)
        run: docker pull ghcr.io/jaxtonmax/hvisor-ci-riscv64:${{ env.IMAGE_VERSION }}
      - name: Run System Test
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} --cap-add=SYS_ADMIN --privileged -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=riscv64 --env BOARD=qemu-plic ghcr.io/jaxtonmax/hvisor-ci-riscv64:${{ env.IMAGE_VERSION }} tail -f /dev/null
          docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
          docker exec ${{ env.CONTAINER_NAME }} make stest
      - if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }} || true

  # =========================================================================
  # License-checker 作业 (保持不变)
  # =========================================================================
  license-checker:
    name: license-checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: License Check
        run: |
          set -x
          ./tools/license_checker.sh