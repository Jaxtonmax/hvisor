name: CI (Final Robust Version)

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  CI_IMAGE_TAG: local/hvisor-ci:latest
  QEMU_VERSION: 9.0.2
  QEMU_TARBALL: qemu-9.0.2.tar.xz

jobs:
  main-test-suite:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 缓存工具链和 QEMU 源码压缩包
      # 我们将所有需要下载的大文件都纳入缓存
      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            toolchains
            ${{ env.QEMU_TARBALL }}
          key: ${{ runner.os }}-deps-${{ hashFiles('toolchains/**') }}-${{ env.QEMU_VERSION }}

      # 3. 下载 QEMU 源码（如果缓存未命中）
      # 这一步在 Runner 主机上执行，而不是在 Docker build 里
      - name: Download QEMU Source (if not cached)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss. Downloading QEMU source..."
          # 使用带有重试和超时机制的 curl 命令，最大限度提高下载成功率
          curl -fSL --retry 5 --retry-delay 2 --connect-timeout 20 -o ${{ env.QEMU_TARBALL }} "https://download.qemu.org/qemu-${{ env.QEMU_VERSION }}.tar.xz"

      # 4. 动态构建 CI 镜像
      # Dockerfile.ci 现在会从本地复制 QEMU 源码，而不是下载
      - name: Build CI Docker Image
        run: |
          docker build -t ${{ env.CI_IMAGE_TAG }} \
            --build-arg TOOLCHAINS_DIR=/workdir/toolchains \
            -f Dockerfile.ci .

      # 5. 在构建好的容器内运行所有测试
      - name: Run Linter
        run: docker run --rm -v ${{ github.workspace }}:/workdir ${{ env.CI_IMAGE_TAG }} make fmt-test

      - name: Run Unit Tests
        run: docker run --rm -v ${{ github.workspace }}:/workdir ${{ env.CI_IMAGE_TAG }} make test
      - name: Run Build Matrix
        run: |
          # 在一个步骤里循环执行所有构建，以提高效率
          docker run --rm -v ${{ github.workspace }}:/workdir ${{ env.CI_IMAGE_TAG }} /bin/bash -c "
            make ARCH=aarch64 BOARD=qemu-gicv3 && \
            make ARCH=aarch64 BOARD=zcu102 && \
            make ARCH=riscv64 BOARD=qemu-plic && \
            make ARCH=loongarch64 BOARD=ls3a5000"
            # 在这里添加所有您的构建矩阵组合

  # ... 其他作业如 license-checker 可以保持原样 ...
  license-checker:
    name: license-checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: License Check
        run: |
          set -x
          ./tools/license_checker.sh