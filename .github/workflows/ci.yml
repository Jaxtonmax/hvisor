# =========================================================================
# hvisor Github Actions CI (v5.1 - 最终修复版)
#
# - Action 修正: 将无法访问的 easimon/maximize-build-space-action
#   替换为当前社区维护的 ci-ros/maximize-build-space-action，以解决
#   "repository not found" 错误。
# - 核心策略不变:
#   1. [最大化空间] 在每个作业开始时清理磁盘空间。
#   2. [精准诊断] 通过 `df -h` 监控磁盘空间变化。
#   3. [隔离问题] loongarch64 镜像因体积过大，依旧不使用缓存。
# =========================================================================

name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  CONTAINER_NAME: ci-container
  IMAGE_VERSION: wzm_3.0.0

jobs:
  # =========================================================================
  # Linter 作业 (已集成空间最大化和诊断)
  # =========================================================================
  linter:
    name: linter
    runs-on: ubuntu-latest
    steps:
      - name: 1. Initial Disk Space Check
        run: df -h

      - name: 2. Maximize Build Space
        uses: ci-ros/maximize-build-space-action@v1
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          
      - name: 3. Disk Space After Cleanup
        run: df -h

      - name: 4. Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 5. Restore Docker Layer Cache for aarch64
        uses: satackey/action-docker-layer-caching@v0.0.11
        with:
          key: docker-cache-aarch64-${{ env.IMAGE_VERSION }}-${{ runner.os }}
        continue-on-error: true

      - name: 6. Pull aarch64 Image (for Linter)
        run: docker pull ghcr.io/jaxtonmax/hvisor-ci-aarch64:${{ env.IMAGE_VERSION }}

      - name: 7. Run Container and Linter Tasks
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} -v ${{ github.workspace }}:/workdir -w /workdir ghcr.io/jaxtonmax/hvisor-ci-aarch64:${{ env.IMAGE_VERSION }} tail -f /dev/null
          docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
          docker exec ${{ env.CONTAINER_NAME }} make fmt-test

      - name: 8. Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

  # =========================================================================
  # Unittest 作业 (已集成空间最大化和诊断)
  # =========================================================================
  unittest:
    name: unittest (${{ matrix.arch }} on ${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: aarch64
            board: "qemu-gicv2"
          - arch: riscv64
            board: "qemu-plic"
          - arch: riscv64
            board: "qemu-aia"
    steps:
      - name: 1. Initial Disk Space Check
        run: df -h
      - name: 2. Maximize Build Space
        uses: ci-ros/maximize-build-space-action@v1
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
      - name: 3. Disk Space After Cleanup
        run: df -h
      - name: 4. Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: 5. Restore Docker Layer Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        with:
          key: docker-cache-${{ matrix.arch }}-${{ env.IMAGE_VERSION }}-${{ runner.os }}
        continue-on-error: true
      - name: 6. Pull Arch Image
        run: docker pull ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:${{ env.IMAGE_VERSION }}
      - name: 7. Run Container and Unit Test
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=${{ matrix.arch }} --env BOARD=${{ matrix.board }} ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:${{ env.IMAGE_VERSION }} tail -f /dev/null
          docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
          docker exec ${{ env.CONTAINER_NAME }} make test
      - name: 8. Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

  # =========================================================================
  # Build 作业 (aarch64 & riscv64, 已集成空间最大化和诊断)
  # =========================================================================
  build:
    name: build (${{ matrix.arch }} on ${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: aarch64
            board: "qemu-gicv2"
          - arch: aarch64
            board: "zcu102"
          - arch: aarch64
            board: "imx8mp"
          - arch: aarch64
            board: "rk3568"
          - arch: aarch64
            board: "rk3588"
          - arch: aarch64
            board: "ok6254-c"
          - arch: riscv64
            board: "qemu-aia"
          - arch: riscv64
            board: "qemu-plic"
    steps:
      - name: 1. Initial Disk Space Check
        run: df -h
      - name: 2. Maximize Build Space
        uses: ci-ros/maximize-build-space-action@v1
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
      - name: 3. Disk Space After Cleanup
        run: df -h
      - name: 4. Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: 5. Restore Docker Layer Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        with:
          key: docker-cache-${{ matrix.arch }}-${{ env.IMAGE_VERSION }}-${{ runner.os }}
        continue-on-error: true
      - name: 6. Pull Arch Image
        run: docker pull ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:${{ env.IMAGE_VERSION }}
      - name: 7. Run Container and Build
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=${{ matrix.arch }} --env BOARD=${{ matrix.board }} ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:${{ env.IMAGE_VERSION }} tail -f /dev/null
          docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
          docker exec ${{ env.CONTAINER_NAME }} make
      - name: 8. Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

  # =========================================================================
  # Build 作业 (loongarch64, 【不使用缓存】)
  # =========================================================================
  build-loongarch64:
    name: build (loongarch64 on ls3a5000)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Pull LoongArch Image (No Cache)
        run: |
          echo "INFO: Caching is disabled for this job due to image size exceeding both disk space and cache upload limits."
          docker pull ghcr.io/jaxtonmax/hvisor-ci-loongarch64:${{ env.IMAGE_VERSION }}
      - name: Run Container and Build
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=loongarch64 --env BOARD=ls3a5000 ghcr.io/jaxtonmax/hvisor-ci-loongarch64:${{ env.IMAGE_VERSION }} tail -f /dev/null
          docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
          docker exec ${{ env.CONTAINER_NAME }} make
      - name: Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

  # =========================================================================
  # Systemtest 作业 (已集成空间最大化和诊断)
  # =========================================================================
  systemtest:
    name: systemtest (${{ matrix.arch }} on ${{ matrix.board }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: riscv64
            board: "qemu-plic"
    steps:
      - name: 1. Initial Disk Space Check
        run: df -h
      - name: 2. Maximize Build Space
        uses: ci-ros/maximize-build-space-action@v1
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
      - name: 3. Disk Space After Cleanup
        run: df -h
      - name: 4. Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: 5. Restore Docker Layer Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        with:
          key: docker-cache-${{ matrix.arch }}-${{ env.IMAGE_VERSION }}-${{ runner.os }}
        continue-on-error: true
      - name: 6. Pull Arch Image
        run: docker pull ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:${{ env.IMAGE_VERSION }}
      - name: 7. Run Container and System Test
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} --cap-add=SYS_ADMIN --privileged -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=${{ matrix.arch }} --env BOARD=${{ matrix.board }} ghcr.io/jaxtonmax/hvisor-ci-${{ matrix.arch }}:${{ env.IMAGE_VERSION }} tail -f /dev/null
          docker exec ${{ env.CONTAINER_NAME }} rustup set auto-self-update disable
          docker exec ${{ env.CONTAINER_NAME }} make stest
      - name: 8. Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

  # =========================================================================
  # License-checker 作业 (保持不变)
  # =========================================================================
  license-checker:
    name: license-checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: License Check
        run: |
          set -x
          ./tools/license_checker.sh