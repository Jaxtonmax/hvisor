# =========================================================================
# hvisor Github Actions CI (v2.0 - 最终优化版)
#
# - 使用全新的 v2.0.0 系列精简镜像，构建速度更快，体积更小。
# - 解决了 LoongArch64 的链接器路径问题。
# - 解决了因镜像体积过大导致的 GitHub Actions 缓存失败问题。
# - 移除了所有冗余的诊断步骤，配置干净、高效。
# =========================================================================

name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  # 关键更新：将镜像版本指向我们全新的、经过优化的 2.0.0 版本
  CI_IMAGE_PREFIX: ghcr.io/jaxtonmax/hvisor-ci
  IMAGE_VERSION: 2.0.0
  CONTAINER_NAME: ci-container

jobs:
  linter:
    name: linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Docker Layer Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Pull CI Image
        run: docker pull ${{ env.CI_IMAGE_PREFIX }}:aarch64_${{ env.IMAGE_VERSION }}

      - name: Run Container in Background
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} \
            -v ${{ github.workspace }}:/workdir \
            -w /workdir \
            ${{ env.CI_IMAGE_PREFIX }}:aarch64_${{ env.IMAGE_VERSION }} \
            tail -f /dev/null

      - name: Format Check
        run: docker exec ${{ env.CONTAINER_NAME }} make fmt-test

      - name: Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

  unittest:
    name: unittest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: aarch64
            board: "qemu-gicv2"
          - arch: riscv64
            board: "qemu-plic"
          - arch: riscv64
            board: "qemu-aia"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Docker Layer Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Pull CI Image
        run: docker pull ${{ env.CI_IMAGE_PREFIX }}:${{ matrix.arch }}_${{ env.IMAGE_VERSION }}

      - name: Run Container in Background
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} \
            -v ${{ github.workspace }}:/workdir \
            -w /workdir \
            --env ARCH=${{ matrix.arch }} \
            --env BOARD=${{ matrix.board }} \
            ${{ env.CI_IMAGE_PREFIX }}:${{ matrix.arch }}_${{ env.IMAGE_VERSION }} \
            tail -f /dev/null

      - name: Unit Test
        run: docker exec ${{ env.CONTAINER_NAME }} make test

      - name: Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

  build:
    name: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: aarch64
            board: "zcu102"
          - arch: aarch64
            board: "rk3588"
          - arch: riscv64
            board: "qemu-plic"
          - arch: loongarch64
            board: "ls3a5000"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Docker Layer Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Pull CI Image
        run: docker pull ${{ env.CI_IMAGE_PREFIX }}:${{ matrix.arch }}_${{ env.IMAGE_VERSION }}

      - name: Run Container in Background
        # 保留 LoongArch 的环境变量注入，作为健壮性保障
        run: |
          LINKER_ENV=""
          if [ "${{ matrix.arch }}" == "loongarch64" ]; then
            LINKER_ENV="--env CARGO_TARGET_LOONGARCH64_UNKNOWN_NONE_LINKER=loongarch64-clfs-linux-gnu-gcc"
          fi
          
          docker run -d --name ${{ env.CONTAINER_NAME }} \
            -v ${{ github.workspace }}:/workdir \
            -w /workdir \
            --env ARCH=${{ matrix.arch }} \
            --env BOARD=${{ matrix.board }} \
            ${LINKER_ENV} \
            ${{ env.CI_IMAGE_PREFIX }}:${{ matrix.arch }}_${{ env.IMAGE_VERSION }} \
            tail -f /dev/null

      - name: Build
        # 保留 LoongArch 的 PATH 导出方案，作为健壮性保障
        # 同时，根据我们修正后的 Dockerfile，更新了 PATH 的具体路径
        run: |
          if [ "${{ matrix.arch }}" == "loongarch64" ]; then
            # 关键更新：路径从 /opt/toolchain/cross-tools/bin 修正为 /opt/toolchain/bin
            docker exec ${{ env.CONTAINER_NAME }} \
              sh -c "PATH=/opt/toolchain/bin:\$PATH make MODE=release"
          else
            docker exec ${{ env.CONTAINER_NAME }} make MODE=release
          fi

      - name: Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

  systemtest:
    name: systemtest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            board: "qemu-gicv3"
          - arch: riscv64
            board: "qemu-plic"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Docker Layer Cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Pull CI Image
        run: docker pull ${{ env.CI_IMAGE_PREFIX }}:${{ matrix.arch }}_${{ env.IMAGE_VERSION }}

      - name: Run Container in Background
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} --privileged \
            -v ${{ github.workspace }}:/workdir \
            -w /workdir \
            --env ARCH=${{ matrix.arch }} \
            --env BOARD=${{ matrix.board }} \
            ${{ env.CI_IMAGE_PREFIX }}:${{ matrix.arch }}_${{ env.IMAGE_VERSION }} \
            tail -f /dev/null

      - name: Run System Test
        run: docker exec ${{ env.CONTAINER_NAME }} make stest

      - name: Stop Container
        if: always()
        run: docker stop ${{ env.CONTAINER_NAME }} && docker rm ${{ env.CONTAINER_NAME }}

  license-checker:
    name: license-checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: License Check
        run: |
          set -x  
          ./tools/license_checker.sh