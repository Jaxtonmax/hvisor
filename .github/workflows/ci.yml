# =========================================================================
# hvisor Github Actions CI (v11.0 - 最终生产版)
#
# - 最终洞察: 基于实际数据，在 GitHub Actions 环境中，`docker pull` 的
#   内置优化（高速网络+分层缓存）已超越所有手动缓存策略。
# - 最终决策: 彻底移除所有手动缓存相关的步骤 (satackey/action-docker-layer-caching)，
#   以消除不必要的时间开销 (约 20-30 秒/作业) 和日志噪音。
#   这使得工作流更简洁、更快速、更易于理解。
# =========================================================================

name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  # =========================================================================
  # Linter 作业 (已移除缓存)
  # =========================================================================
  linter:
    name: linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Pull aarch64 Image
        run: docker pull ghcr.io/jaxtonmax/hvisor-ci-aarch64:wzm_3.0.0

      - name: Run Container and Linter Tasks
        run: |
          docker run -d --name ci-container -v ${{ github.workspace }}:/workdir -w /workdir ghcr.io/jaxtonmax/hvisor-ci-aarch64:wzm_3.0.0 tail -f /dev/null
          docker exec ci-container rustup set auto-self-update disable
          docker exec ci-container make fmt-test

      - name: Stop Container
        if: always()
        run: docker stop ci-container && docker rm ci-container || true

  # =========================================================================
  # Unittest 作业 (已移除缓存)
  # =========================================================================
  unittest-aarch64:
    name: unittest (aarch64 on ${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ["qemu-gicv3", "qemu-gicv2"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Pull aarch64 Image
        run: docker pull ghcr.io/jaxtonmax/hvisor-ci-aarch64:wzm_3.0.0
      - name: Run Container and Unit Test
        run: |
          docker run -d --name ci-container -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=aarch64 --env BOARD=${{ matrix.board }} ghcr.io/jaxtonmax/hvisor-ci-aarch64:wzm_3.0.0 tail -f /dev/null
          docker exec ci-container rustup set auto-self-update disable
          docker exec ci-container make test
      - name: Stop Container
        if: always()
        run: docker stop ci-container && docker rm ci-container || true

  unittest-riscv64:
    name: unittest (riscv64 on ${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ["qemu-plic", "qemu-aia"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Pull riscv64 Image
        run: docker pull ghcr.io/jaxtonmax/hvisor-ci-riscv64:wzm_3.0.0
      - name: Run Container and Unit Test
        run: |
          docker run -d --name ci-container -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=riscv64 --env BOARD=${{ matrix.board }} ghcr.io/jaxtonmax/hvisor-ci-riscv64:wzm_3.0.0 tail -f /dev/null
          docker exec ci-container rustup set auto-self-update disable
          docker exec ci-container make test
      - name: Stop Container
        if: always()
        run: docker stop ci-container && docker rm ci-container || true

  # =========================================================================
  # Build 作业 (已移除缓存)
  # =========================================================================
  build-aarch64:
    name: build (aarch64 on ${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ["qemu-gicv3", "qemu-gicv2", "zcu102", "imx8mp", "rk3568", "rk3588", "ok6254-c"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Pull aarch64 Image
        run: docker pull ghcr.io/jaxtonmax/hvisor-ci-aarch64:wzm_3.0.0
      - name: Run Container and Build
        run: |
          docker run -d --name ci-container -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=aarch64 --env BOARD=${{ matrix.board }} ghcr.io/jaxtonmax/hvisor-ci-aarch64:wzm_3.0.0 tail -f /dev/null
          docker exec ci-container rustup set auto-self-update disable
          docker exec ci-container make
      - name: Stop Container
        if: always()
        run: docker stop ci-container && docker rm ci-container || true

  build-riscv64:
    name: build (riscv64 on ${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ["qemu-aia", "qemu-plic"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Pull riscv64 Image
        run: docker pull ghcr.io/jaxtonmax/hvisor-ci-riscv64:wzm_3.0.0
      - name: Run Container and Build
        run: |
          docker run -d --name ci-container -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=riscv64 --env BOARD=${{ matrix.board }} ghcr.io/jaxtonmax/hvisor-ci-riscv64:wzm_3.0.0 tail -f /dev/null
          docker exec ci-container rustup set auto-self-update disable
          docker exec ci-container make
      - name: Stop Container
        if: always()
        run: docker stop ci-container && docker rm ci-container || true

  build-loongarch64:
    name: build (loongarch64 on ls3a5000)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Pull LoongArch Image
        run: docker pull ghcr.io/jaxtonmax/hvisor-ci-loongarch64:wzm_3.0.0
      - name: Run Container and Build
        run: |
          docker run -d --name ci-container -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=loongarch64 --env BOARD=ls3a5000 ghcr.io/jaxtonmax/hvisor-ci-loongarch64:wzm_3.0.0 tail -f /dev/null
          docker exec ci-container rustup set auto-self-update disable
          docker exec ci-container make
      - name: Stop Container
        if: always()
        run: docker stop ci-container && docker rm ci-container || true

  # =========================================================================
  # Systemtest 作业 (已移除缓存)
  # =========================================================================
  systemtest-aarch64:
    name: systemtest (aarch64 on qemu-gicv3)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Pull aarch64 Image
        run: docker pull ghcr.io/jaxtonmax/hvisor-ci-aarch64:wzm_3.0.0
      - name: Run Container and System Test
        run: |
          docker run -d --name ci-container --cap-add=SYS_ADMIN --privileged -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=aarch64 --env BOARD=qemu-gicv3 ghcr.io/jaxtonmax/hvisor-ci-aarch64:wzm_3.0.0 tail -f /dev/null
          docker exec ci-container rustup set auto-self-update disable
          docker exec ci-container make stest
      - name: Stop Container
        if: always()
        run: docker stop ci-container && docker rm ci-container || true

  systemtest-riscv64:
    name: systemtest (riscv64 on qemu-plic)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Pull riscv64 Image
        run: docker pull ghcr.io/jaxtonmax/hvisor-ci-riscv64:wzm_3.0.0
      - name: Run Container and System Test
        run: |
          docker run -d --name ci-container --cap-add=SYS_ADMIN --privileged -v ${{ github.workspace }}:/workdir -w /workdir --env ARCH=riscv64 --env BOARD=qemu-plic ghcr.io/jaxtonmax/hvisor-ci-riscv64:wzm_3.0.0 tail -f /dev/null
          docker exec ci-container rustup set auto-self-update disable
          docker exec ci-container make stest
      - name: Stop Container
        if: always()
        run: docker stop ci-container && docker rm ci-container || true

  # =========================================================================
  # License-checker 作业 (保持不变)2
  # =========================================================================
  license-checker:
    name: license-checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: License Check
        run: |
          set -x
          ./tools/license_checker.sh